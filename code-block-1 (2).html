<!DOCTYPE html>
<html lang="en">
<head><script>
(function () {
  var VERSION = 1;
  var pending = {};
  var seq = 0;
  var ctx = {};
  var nonce = null;
  var ready;
  var readyPromise = new Promise(function (resolve) { ready = resolve; });

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var msg = event.data;
    if (!msg || msg.v !== VERSION) return;
    if (msg.type === 'celeste.rpc.init') {
      nonce = msg.nonce || null;
      ctx = msg.context || {};
      ready();
    } else if (msg.type === 'celeste.rpc.response') {
      var entry = pending[msg.id];
      if (!entry) return;
      delete pending[msg.id];
      clearTimeout(entry.timer);
      if (msg.ok) {
        entry.resolve(msg.data);
      } else {
        var err = (msg.error && msg.error.message) || 'celeste: request failed';
        entry.reject(new Error(err));
      }
    }
  });

  function rpc(op, name, params) {
    return readyPromise.then(function () {
      return new Promise(function (resolve, reject) {
        var id = 'c' + (++seq);
        var timer = setTimeout(function () {
          if (pending[id]) {
            delete pending[id];
            reject(new Error('celeste: request timed out'));
          }
        }, 30000);
        pending[id] = { resolve: resolve, reject: reject, timer: timer };
        window.parent.postMessage({
          v: VERSION,
          type: 'celeste.rpc.request',
          id: id,
          op: op,
          name: name,
          params: params || {},
          nonce: nonce
        }, '*');
      });
    });
  }

  var celeste = {
    query: function (name, params) { return rpc('query', name, params); },
    action: function (name, params) { return rpc('action', name, params); },
    getContext: function () { return JSON.parse(JSON.stringify(ctx)); }
  };
  Object.freeze(celeste);
  Object.defineProperty(window, 'celeste', {
    value: celeste, writable: false, configurable: false
  });
  window.parent.postMessage({ v: VERSION, type: 'celeste.rpc.hello' }, '*');
})();
</script>

<script>
/* ─── RESPONSE UNWRAPPER ─────────────────────────────────────────────── */
function extractObj(raw, key) {
  if (!raw) return null;
  if (raw && typeof raw === "object" && !Array.isArray(raw) && (key ? key in raw : true)) return raw;
  if (Array.isArray(raw)) {
    for (var i = 0; i < raw.length; i++) {
      var b = raw[i];
      var v = (b && b.text != null) ? b.text : (b && b.content != null) ? b.content : (b && b.value != null) ? b.value : (b && b.data != null) ? b.data : b;
      if (typeof v === "string") {
        try { var p = JSON.parse(v); if (!key || key in p) return p; } catch(e) {}
      }
      if (v && typeof v === "object" && !Array.isArray(v)) {
        if (!key || key in v) return v;
        var envs = ["result","data","value","payload"];
        for (var j = 0; j < envs.length; j++) {
          if (v[envs[j]] && typeof v[envs[j]] === "object" && (!key || key in v[envs[j]])) return v[envs[j]];
        }
      }
    }
  }
  if (typeof raw === "string") {
    try { var p2 = JSON.parse(raw); if (!key || key in p2) return p2; } catch(e2) {}
  }
  return null;
}

/* ─── TREE FLATTENER ─────────────────────────────────────────────────── */
function flattenNode(node, parentId, out, seen) {
  if (!node) return;
  var id = node.externalId || node.key || null;
  if (!id) return;
  if (seen.has(id)) return;
  seen.add(id);
  out.push({
    id: id,
    name: node.name || node.displayName || node.nameWithoutHonorifics || id,
    parentId: parentId
  });
  var children = node.subCompanies || node.children || [];
  for (var i = 0; i < children.length; i++) {
    flattenNode(children[i], id, out, seen);
  }
}

/* ─── MAIN LOADER ────────────────────────────────────────────────────── */
async function loadParty() {
  var pidInput = document.getElementById("pid");
  var providerSelect = document.getElementById("provider");
  var errEl = document.getElementById("lerr");
  var btn = document.getElementById("load-btn");
  errEl.textContent = "";

  var partyId = (pidInput.value || "").trim();
  if (!partyId) {
    errEl.textContent = "Please enter a Party ID.";
    return;
  }

  var provider = providerSelect.value;
  btn.textContent = "Loading\u2026";
  btn.disabled = true;

  try {
    var partyRaw = await celeste.query(
      "intapp_compliance__get_party",
      { partyId: partyId, propertiesToLoad: ["CorporateFamily"] }
    );
    var party = extractObj(partyRaw, "partyId");
    if (!party) throw new Error("Could not load party " + partyId + ". Check the ID and try again.");

    var partyName = party.name || partyId;
    var nodes = [];
    var seen = new Set();
    var usedExternalId = null;

    var corpTrees = party.corporateTrees || [];
    var matchedTree = null;

    for (var i = 0; i < corpTrees.length; i++) {
      if (corpTrees[i].providerType === provider) {
        matchedTree = corpTrees[i];
        break;
      }
    }
    if (!matchedTree && corpTrees.length > 0) {
      matchedTree = corpTrees[0];
    }

    if (matchedTree && matchedTree.rootCompany) {
      usedExternalId = matchedTree.rootCompanyId || matchedTree.rootCompany.externalId;
      flattenNode(matchedTree.rootCompany, null, nodes, seen);
    }

    if (nodes.length === 0) {
      var extId = null;
      if (provider === "BureauVanDijk") {
        extId = party.bureauVanDijkId || party.externalId || null;
      } else if (provider === "DunAndBradstreet") {
        extId = party.dunsNumber || party.externalId || null;
      } else {
        extId = party.externalId || party.bureauVanDijkId || party.dunsNumber || null;
      }

      var corpFamily = party.corporateFamily || {};
      var entries = corpFamily.entries || corpFamily.corporateFamilyEntries || [];
      if (Array.isArray(entries) && entries.length > 0 && !extId) {
        for (var k = 0; k < entries.length; k++) {
          var e = entries[k];
          if (e.provider === provider || e.dataProvider === provider) {
            extId = e.externalId || e.key || e.id;
            break;
          }
        }
        if (!extId && entries[0]) {
          extId = entries[0].externalId || entries[0].key || entries[0].id;
        }
      }

      if (!extId) {
        throw new Error("Party " + partyName + " (" + partyId + ") has no external ID for provider " + provider + ".");
      }

      usedExternalId = extId;

      var treeRaw = await celeste.query(
        "intapp_compliance__load_corporate_tree_data",
        { externalId: extId, provider: provider }
      );
      var treeData = extractObj(treeRaw, "corporateTrees");
      if (treeData && treeData.corporateTrees) {
        for (var m = 0; m < treeData.corporateTrees.length; m++) {
          flattenNode(treeData.corporateTrees[m], null, nodes, seen);
        }
      }
    }

    if (!nodes.length) {
      throw new Error("Corporate tree was empty for " + partyName + ".");
    }

    var DATA = {
      id: usedExternalId,
      highlight: [],
      trees: [],
      legend: [],
      nodes: nodes,
      indicatorActions: {}
    };
    var META = {};

    initApp(DATA, META, partyName);

  } catch (e) {
    errEl.textContent = "Error: " + e.message;
    btn.textContent = "Load";
    btn.disabled = false;
  }
}

/* ─── APP INIT ───────────────────────────────────────────────────────── */
function initApp(DATA, META, titleOverride) {
  document.getElementById("loader").style.display = "none";
  document.getElementById("app").style.display = "block";

  var activeIcon = null;
  var filterText = "";

  var nodeMap = new Map();
  DATA.nodes.forEach(function(n) { nodeMap.set(n.id, n); });

  var childrenOf = new Map();
  DATA.nodes.forEach(function(n) {
    if (!childrenOf.has(n.parentId)) childrenOf.set(n.parentId, []);
    childrenOf.get(n.parentId).push(n);
  });

  var roots = DATA.nodes.filter(function(n) {
    return n.parentId === null || !nodeMap.has(n.parentId);
  });

  var anchorNode = nodeMap.get(DATA.id);
  var headerTitle = document.getElementById("header-title");
  headerTitle.textContent = titleOverride || (anchorNode ? anchorNode.name : "Corporate tree");

  function getAncestors(nodeId) {
    var ancestors = new Set();
    var cur = nodeMap.get(nodeId);
    while (cur && cur.parentId != null && nodeMap.has(cur.parentId)) {
      ancestors.add(cur.parentId);
      cur = nodeMap.get(cur.parentId);
    }
    return ancestors;
  }

  function flattenTree(nodeList, depth, ancestorDepths) {
    var rows = [];
    nodeList.forEach(function(node, idx) {
      var isLast = idx === nodeList.length - 1;
      var newAncestorDepths = new Set(ancestorDepths);
      if (!isLast) newAncestorDepths.add(depth);
      rows.push({ node: node, depth: depth, isLast: isLast, ancestorDepths: new Set(ancestorDepths) });
      var children = childrenOf.get(node.id) || [];
      if (children.length) {
        flattenTree(children, depth + 1, newAncestorDepths).forEach(function(r) { rows.push(r); });
      }
    });
    return rows;
  }

  var allRows = flattenTree(roots, 0, new Set());

  var legendStrip = document.getElementById("legend-strip");
  if (!DATA.legend || DATA.legend.length === 0) {
    legendStrip.classList.add("hidden");
  }

  function renderTree() {
    var container = document.getElementById("tree-container");
    container.innerHTML = "";

    var legendVisible = null;
    if (activeIcon) {
      var matching = new Set(
        DATA.nodes.filter(function(n) { return n.indicators && n.indicators.includes(activeIcon); }).map(function(n) { return n.id; })
      );
      legendVisible = new Set(matching);
      matching.forEach(function(id) {
        getAncestors(id).forEach(function(aid) { legendVisible.add(aid); });
      });
    }

    var txt = filterText.trim().toLowerCase();
    var textVisible = null;
    if (txt) {
      var matching2 = new Set(
        DATA.nodes.filter(function(n) { return (n.name + " " + (n.id || "")).toLowerCase().includes(txt); }).map(function(n) { return n.id; })
      );
      textVisible = new Set(matching2);
      matching2.forEach(function(id) {
        getAncestors(id).forEach(function(aid) { textVisible.add(aid); });
      });
    }

    var visibleCount = 0;

    allRows.forEach(function(r) {
      var node = r.node, depth = r.depth, isLast = r.isLast, ancestorDepths = r.ancestorDepths;
      if (legendVisible !== null && !legendVisible.has(node.id)) return;
      if (textVisible !== null && !textVisible.has(node.id)) return;

      visibleCount++;

      var row = document.createElement("div");
      row.className = "tree-node";
      if (DATA.highlight && DATA.highlight.includes(node.id)) {
        row.classList.add("highlighted");
      }

      for (var d = 0; d < depth; d++) {
        var ind = document.createElement("span");
        ind.className = "indent";
        ind.textContent = ancestorDepths.has(d) ? "\u2502" : " ";
        row.appendChild(ind);
      }

      if (depth > 0) {
        var conn = document.createElement("span");
        conn.className = "connector";
        conn.textContent = isLast ? "\u2514\u2500" : "\u251C\u2500";
        row.appendChild(conn);
      }

      var content = document.createElement("span");
      content.className = "node-content";

      var isRoot = node.parentId === null || !nodeMap.has(node.parentId);
      if (isRoot) {
        var crown = document.createElement("span");
        crown.className = "root-icon";
        crown.textContent = "\uD83D\uDC51";
        content.appendChild(crown);
      }

      var nameSpan = document.createElement("span");
      nameSpan.className = "node-name";
      nameSpan.textContent = node.name;
      content.appendChild(nameSpan);

      var idSpan = document.createElement("span");
      idSpan.className = "node-id";
      idSpan.textContent = "(" + node.id + ")";
      content.appendChild(idSpan);

      if (node.id === DATA.id) {
        var anchor = document.createElement("span");
        anchor.className = "node-anchor";
        anchor.textContent = "\u25C6";
        content.appendChild(anchor);
      }

      if (node.indicators && node.indicators.length > 0) {
        var indWrap = document.createElement("span");
        indWrap.className = "node-indicators";
        node.indicators.forEach(function(icon) {
          var s = document.createElement("span");
          s.textContent = icon;
          indWrap.appendChild(s);
        });
        content.appendChild(indWrap);
      }

      row.appendChild(content);
      container.appendChild(row);
    });

    document.getElementById("node-count").textContent =
      visibleCount + " / " + DATA.nodes.length + " nodes";
    document.getElementById("no-results").style.display =
      visibleCount === 0 ? "block" : "none";
  }

  var filterInput = document.getElementById("filter-input");
  filterInput.addEventListener("input", function() {
    filterText = filterInput.value;
    renderTree();
  });

  document.getElementById("clear-btn").addEventListener("click", function() {
    filterInput.value = "";
    filterText = "";
    activeIcon = null;
    document.querySelectorAll(".legend-pill").forEach(function(p) { p.classList.remove("active"); });
    renderTree();
  });

  renderTree();
}

function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function jpOpen(action, nodeId) { /* placeholder */ }
function jpSwitchPill(view) { /* placeholder */ }
function jpClose() { document.getElementById("jp-backdrop").classList.remove("open"); }
function jpHandleBackdrop(e) { if (e.target === document.getElementById("jp-backdrop")) jpClose(); }
document.addEventListener("keydown", function(e) { if (e.key === "Escape") jpClose(); });
