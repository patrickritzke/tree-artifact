<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corporate Tree</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; background: #f5f6f8; color: #1a1a2e; min-height: 100vh;
  }
  button { font: inherit; }

  /* ── Header ── */
  #header {
    background: #1a1a2e; color: #fff; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  #header-title { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mode-badge {
    font-size: 11px; color: #c7d2fe; border: 1px solid #4b4b7a; border-radius: 999px;
    padding: 2px 9px; display: none;
  }
  #mode-badge.show { display: inline-block; }
  #node-count { font-size: 12px; color: #9ca3af; white-space: nowrap; }

  /* ── Gear ── */
  #gear-wrap { position: relative; }
  #gear-btn {
    background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 17px;
    width: 28px; height: 28px; border-radius: 6px; line-height: 1; opacity: .75;
    transition: opacity .15s, background .15s, color .15s;
  }
  #gear-btn:hover, #gear-btn[aria-expanded="true"] { opacity: 1; background: rgba(255,255,255,.1); color: #fff; }
  #gear-menu {
    display: none; position: absolute; right: 0; top: 34px; min-width: 170px;
    background: #fff; color: #1a1a2e; border: 1px solid #e5e7eb; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 4px; z-index: 150;
  }
  #gear-menu.open { display: block; }
  .gear-title { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #9ca3af; font-weight: 600; padding: 6px 10px 4px; }
  .gear-opt {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 10px; border: none; background: none; border-radius: 5px; cursor: pointer; font-size: 13px; color: #374151;
  }
  .gear-opt:hover { background: #f3f4f6; }
  .gear-opt .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #d1d5db; flex-shrink: 0; }
  .gear-opt.active { color: #4338ca; font-weight: 600; }
  .gear-opt.active .dot { background: #6366f1; border-color: #6366f1; }

  /* ── Toolbars ── */
  .toolbar { padding: 12px 20px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .toolbar label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #6b7280; font-weight: 600; }
  .toolbar input[type=text], .toolbar select {
    padding: 7px 12px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 13px;
    background: #fff; color: #1a1a2e; outline: none; transition: border-color .15s;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: #6366f1; }
  #target-input { width: 320px; max-width: 100%; }
  #filter-input { flex: 1; max-width: 420px; }
  .btn {
    padding: 7px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;
    font-size: 13px; cursor: pointer; color: #374151; transition: background .15s;
  }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #1a1a2e; border-color: #1a1a2e; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #2d2d4e; }
  #target-err { font-size: 12px; color: #dc2626; }
  #owner-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip { font-size: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 999px; padding: 3px 10px; color: #374151; }
  .chip b { color: #6b7280; font-weight: 600; margin-right: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }

  /* ── Grids ── */
  .section { margin: 16px 20px 0; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .section-head h2 { font-size: 13px; font-weight: 600; color: #111827; flex: 1; }
  .section-head .count { font-size: 12px; color: #6b7280; }
  .icon-btn { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: #374151; }
  .icon-btn:hover { background: #f3f4f6; }
  .grid-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: auto; max-height: 420px; }
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th {
    position: sticky; top: 0; background: #f9fafb; text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: .5px; color: #6b7280; font-weight: 600; padding: 7px 12px; border-bottom: 1px solid #e5e7eb; white-space: nowrap;
  }
  table.grid td { padding: 4px 12px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid tr.anchor td { background: #fef9c3; }
  td.name-cell { display: flex; align-items: center; }
  .indent { display: inline-block; flex-shrink: 0; }
  .toggle {
    width: 18px; height: 18px; flex-shrink: 0; border: none; background: none; cursor: pointer;
    color: #6b7280; font-size: 10px; border-radius: 4px;
  }
  .toggle:hover { background: #e5e7eb; }
  .toggle.leaf { visibility: hidden; cursor: default; }
  .node-name { font-weight: 500; color: #111827; margin-left: 2px; }
  .node-id { color: #6b7280; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty { padding: 24px; color: #6b7280; font-size: 13px; }
  #app { display: none; padding-bottom: 40px; }
</style>
</head>
<body>

<div id="header">
  <span id="header-title">Corporate Tree</span>
  <span id="mode-badge"></span>
  <span id="node-count"></span>
  <div id="gear-wrap">
    <button id="gear-btn" title="Settings" aria-haspopup="true" aria-expanded="false">&#9881;</button>
    <div id="gear-menu" role="menu">
      <div class="gear-title">Mode</div>
      <button class="gear-opt active" data-mode="general" role="menuitemradio"><span class="dot"></span>General</button>
      <button class="gear-opt" data-mode="updates" role="menuitemradio"><span class="dot"></span>Tree Updates</button>
      <button class="gear-opt" data-mode="independence" role="menuitemradio"><span class="dot"></span>Independence</button>
    </div>
  </div>
</div>

<!-- General: target company input -->
<div class="toolbar" id="target-bar">
  <label for="target-input">Target company</label>
  <input id="target-input" type="text" list="target-list" placeholder="Name or ID, e.g. NW-0002 or Orion" autocomplete="off" />
  <datalist id="target-list"></datalist>
  <button class="btn primary" id="load-btn">Load</button>
  <span id="target-err"></span>
</div>

<div id="app">
  <div class="toolbar" id="owner-bar"><div id="owner-chips"></div></div>

  <!-- General: filter / search -->
  <div class="toolbar" id="filter-bar">
    <input id="filter-input" type="text" placeholder="Filter by name or ID…" autocomplete="off" />
    <button class="btn" id="clear-btn">Clear</button>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Corporate tree</h2>
      <span class="count" id="tree-count"></span>
      <button class="icon-btn" data-grid="tree" data-act="expand">Expand all</button>
      <button class="icon-btn" data-grid="tree" data-act="collapse">Collapse all</button>
    </div>
    <div class="grid-wrap" id="tree-grid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Close affiliates</h2>
      <span class="count" id="aff-count"></span>
      <button class="icon-btn" data-grid="aff" data-act="expand">Expand all</button>
      <button class="icon-btn" data-grid="aff" data-act="collapse">Collapse all</button>
    </div>
    <div class="grid-wrap" id="aff-grid"></div>
  </div>
</div>

<script>
/* ═══ DATA PROVIDER ═══════════════════════════════════════════════════════
   Swap this for a live source. Contract:
     getData(target) -> { nodes: [...], affiliates: [...] }
   node:      { id, name, parents: [id, ...] }     (no parents = ultimate owner)
   affiliate: { id, name, parent: id|null }      (hierarchical, like nodes)
   ═══════════════════════════════════════════════════════════════════════ */
var SAMPLE = {
  nodes: [
    { id: "NW-0001", name: "Northwind Global Holdings Inc.", parents: [] },
    { id: "NW-0002", name: "Northwind Americas LLC", parents: ["NW-0001"] },
    { id: "NW-0003", name: "Northwind Capital Partners LP", parents: ["NW-0002"] },
    { id: "NW-0004", name: "Northwind Real Estate Fund I", parents: ["NW-0003"] },
    { id: "NW-0005", name: "Northwind Real Estate Fund II", parents: ["NW-0003"] },
    { id: "NW-0006", name: "Northwind Canada Ltd.", parents: ["NW-0002"] },
    { id: "NW-0007", name: "Northwind Europe plc", parents: ["NW-0001"] },
    { id: "NW-0008", name: "Northwind UK Services Ltd", parents: ["NW-0007"] },
    { id: "NW-0009", name: "Northwind Deutschland GmbH", parents: ["NW-0007"] },
    { id: "NW-0010", name: "Northwind France SAS", parents: ["NW-0007"] },
    { id: "NW-0011", name: "Northwind Asia Pacific Pte. Ltd.", parents: ["NW-0001"] },
    { id: "NW-0012", name: "Northwind Japan K.K.", parents: ["NW-0011"] },
    { id: "NW-0013", name: "Northwind Australia Pty Ltd", parents: ["NW-0011"] },
    { id: "KG-0001", name: "Kestrel Group SA", parents: [] },
    { id: "KG-0002", name: "Kestrel Industrial Holdings", parents: ["KG-0001"] },
    { id: "JV-0001", name: "Orion Industrial JV", parents: ["NW-0011", "KG-0002"] },
    { id: "JV-0002", name: "Orion Logistics Ltd", parents: ["JV-0001"] }
  ],
  affiliates: [
    { id: "NW-0006", name: "Northwind Canada Ltd.", parent: null },
    { id: "NW-0003", name: "Northwind Capital Partners LP", parent: null },
    { id: "NW-0004", name: "Northwind Real Estate Fund I", parent: "NW-0003" },
    { id: "NW-0005", name: "Northwind Real Estate Fund II", parent: "NW-0003" },
    { id: "NW-0011", name: "Northwind Asia Pacific Pte. Ltd.", parent: null },
    { id: "NW-0012", name: "Northwind Japan K.K.", parent: "NW-0011" },
    { id: "KG-0002", name: "Kestrel Industrial Holdings", parent: null }
  ]
};

function getData(/* target */) {
  return Promise.resolve(SAMPLE);
}

/* ═══ STATE ═══════════════════════════════════════════════════════════ */
var MODES = {
  general:      { label: "General" },
  updates:      { label: "Tree Updates" },
  independence: { label: "Independence" }
};
var state = {
  mode: "general",
  data: null,
  target: null,
  owners: [],
  filter: "",
  expanded: { tree: new Set(), aff: new Set() }
};

var $ = function (id) { return document.getElementById(id); };

/* ═══ HELPERS ═════════════════════════════════════════════════════════ */
function indexNodes(list, parentsOf) {
  var byId = new Map(), kids = new Map();
  list.forEach(function (n) { byId.set(n.id, n); });
  list.forEach(function (n) {
    parentsOf(n).forEach(function (p) {
      if (!byId.has(p)) return;
      if (!kids.has(p)) kids.set(p, []);
      kids.get(p).push(n);
    });
  });
  return { byId: byId, kids: kids };
}

function ancestorsOf(id, idx, parentsOf) {
  var out = new Set(), stack = [id];
  while (stack.length) {
    var n = idx.byId.get(stack.pop());
    if (!n) continue;
    parentsOf(n).forEach(function (p) {
      if (idx.byId.has(p) && !out.has(p)) { out.add(p); stack.push(p); }
    });
  }
  return out;
}

function resolveTarget(query, nodes) {
  var q = query.trim().toLowerCase();
  if (!q) return null;
  var exact = nodes.filter(function (n) { return n.id.toLowerCase() === q || n.name.toLowerCase() === q; });
  if (exact.length) return exact[0];
  var partial = nodes.filter(function (n) { return n.name.toLowerCase().indexOf(q) !== -1; });
  return partial.length ? partial[0] : null;
}

/* ═══ LOAD TARGET ═════════════════════════════════════════════════════ */
function loadTarget() {
  var err = $("target-err");
  err.textContent = "";
  var query = $("target-input").value;
  if (!query.trim()) { err.textContent = "Enter a target company."; return; }

  getData(query).then(function (data) {
    var target = resolveTarget(query, data.nodes);
    if (!target) { err.textContent = "No company found for “" + query.trim() + "”."; return; }

    var idx = indexNodes(data.nodes, function (n) { return n.parents; });
    var anc = ancestorsOf(target.id, idx, function (n) { return n.parents; });
    var chain = anc.size ? Array.from(anc) : [];
    /* Ultimate owners: ancestors (or the target itself) with no parents */
    var owners = (chain.length ? chain : [target.id])
      .map(function (id) { return idx.byId.get(id); })
      .filter(function (n) { return n.parents.length === 0; });

    state.data = data;
    state.target = target;
    state.owners = owners;
    state.expanded.tree = new Set();
    state.expanded.aff = new Set();
    state.filter = "";
    $("filter-input").value = "";

    /* Default expansion: path from each owner down to the target */
    owners.forEach(function (o) { state.expanded.tree.add(o.id); });
    anc.forEach(function (id) { state.expanded.tree.add(id); });

    $("header-title").textContent = target.name;
    $("app").style.display = "block";
    renderOwners();
    renderAll();
  });
}

function renderOwners() {
  var wrap = $("owner-chips");
  wrap.innerHTML = "";
  state.owners.forEach(function (o) {
    var c = document.createElement("span");
    c.className = "chip";
    var b = document.createElement("b");
    b.textContent = state.owners.length > 1 ? "Ultimate owners" : "Ultimate owner";
    if (o !== state.owners[0]) b.textContent = " ";
    c.appendChild(b);
    c.appendChild(document.createTextNode(o.name + " (" + o.id + ")"));
    wrap.appendChild(c);
  });
}

/* ═══ GRID RENDERER ═══════════════════════════════════════════════════
   One renderer for both grids: expand/collapse toggle, indent, name, id,
   plus extra columns contributed by the active mode.
   ═══════════════════════════════════════════════════════════════════ */
/* Mode-specific columns are added here once Tree Updates / Independence are built. */
function extraColumns() { return []; }

/* gridKey: "tree" | "aff"; roots/idx/parentsOf describe the structure */
function renderGrid(gridKey, containerId, countId, nodes, roots, parentsOf) {
  var idx = indexNodes(nodes, parentsOf);
  var txt = state.filter.trim().toLowerCase();
  var filtering = !!txt;

  /* Visible set = matches + their ancestors; filtering force-expands */
  var visible = null;
  if (filtering) {
    visible = new Set();
    nodes.forEach(function (n) {
      if (n.group) return;
      var hit = (!txt || (n.name + " " + n.id).toLowerCase().indexOf(txt) !== -1);
      if (!hit) return;
      visible.add(n.id);
      ancestorsOf(n.id, idx, parentsOf).forEach(function (a) { visible.add(a); });
    });
  }

  var cols = extraColumns();
  var table = document.createElement("table");
  table.className = "grid";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  ["Name", "ID"].concat(cols.map(function (c) { return c.title; })).forEach(function (t) {
    var th = document.createElement("th");
    th.textContent = t;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  var tbody = document.createElement("tbody");
  var shown = 0;

  function walk(node, depth, trail) {
    if (visible && !visible.has(node.id)) return;
    if (trail.indexOf(node.id) !== -1) return; /* cycle guard */
    var kids = (idx.kids.get(node.id) || []).filter(function (k) { return !visible || visible.has(k.id); });
    var open = filtering || state.expanded[gridKey].has(node.id);
    shown++;

    var tr = document.createElement("tr");
    if (node.group) tr.className = "group";
    if (state.target && node.id === state.target.id && !node.group) tr.className = "anchor";

    var nameTd = document.createElement("td");
    nameTd.className = "name-cell";
    var ind = document.createElement("span");
    ind.className = "indent";
    ind.style.width = (depth * 20) + "px";
    nameTd.appendChild(ind);

    var tg = document.createElement("button");
    tg.className = "toggle" + (kids.length ? "" : " leaf");
    tg.textContent = open ? "▾" : "▸";
    tg.setAttribute("aria-label", open ? "Collapse" : "Expand");
    if (kids.length) {
      tg.addEventListener("click", function () {
        var set = state.expanded[gridKey];
        if (set.has(node.id)) set.delete(node.id); else set.add(node.id);
        renderAll();
      });
    }
    nameTd.appendChild(tg);

    var nm = document.createElement("span");
    nm.className = "node-name";
    nm.textContent = node.name;
    nameTd.appendChild(nm);
    tr.appendChild(nameTd);

    var idTd = document.createElement("td");
    var idSp = document.createElement("span");
    idSp.className = "node-id";
    idSp.textContent = node.id;
    idTd.appendChild(idSp);
    tr.appendChild(idTd);

    cols.forEach(function (c) {
      var td = document.createElement("td");
      if (!node.group) c.cell(node, td);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    if (open) kids.forEach(function (k) { walk(k, depth + 1, trail.concat(node.id)); });
  }

  roots.forEach(function (r) { walk(r, 0, []); });
  table.appendChild(tbody);

  var host = $(containerId);
  host.innerHTML = "";
  if (!shown) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No matching entities.";
    host.appendChild(e);
  } else {
    host.appendChild(table);
  }
  var real = 0;
  nodes.forEach(function (n) { if (!n.group) real++; });
  $(countId).textContent = (filtering ? "filtered · " : "") + real + " entities";
  return idx;
}

/* ═══ RENDER ALL ══════════════════════════════════════════════════════ */
function renderAll() {
  if (!state.data) return;

  /* Tree grid: only the tree(s) beneath the ultimate owner(s) */
  var allIdx = indexNodes(state.data.nodes, function (n) { return n.parents; });
  var inTree = new Set();
  (function collect(list) {
    list.forEach(function (n) {
      if (inTree.has(n.id)) return;
      inTree.add(n.id);
      collect(allIdx.kids.get(n.id) || []);
    });
  })(state.owners);
  var treeNodes = state.data.nodes.filter(function (n) { return inTree.has(n.id); });
  renderGrid("tree", "tree-grid", "tree-count", treeNodes, state.owners, function (n) { return n.parents; });

  /* Close affiliates grid */
  var affNodes = state.data.affiliates;
  var affIdx = indexNodes(affNodes, function (n) { return n.parent ? [n.parent] : []; });
  var affRoots = affNodes.filter(function (n) { return !n.parent || !affIdx.byId.has(n.parent); });
  renderGrid("aff", "aff-grid", "aff-count", affNodes, affRoots, function (n) { return n.parent ? [n.parent] : []; });

  $("node-count").textContent = treeNodes.length + " in tree · " +
    affNodes.length + " affiliates";
}

/* ═══ MODES (gear) — selection only; features land per mode later ═══ */
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".gear-opt").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-mode") === mode);
  });
  var badge = $("mode-badge");
  badge.textContent = MODES[mode].label;
  badge.classList.toggle("show", mode !== "general");
  closeGear();
  renderAll();
}

function closeGear() {
  $("gear-menu").classList.remove("open");
  $("gear-btn").setAttribute("aria-expanded", "false");
}

/* ═══ WIRING ══════════════════════════════════════════════════════════ */
$("gear-btn").addEventListener("click", function (e) {
  e.stopPropagation();
  var open = $("gear-menu").classList.toggle("open");
  this.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", function (e) {
  if (!$("gear-wrap").contains(e.target)) closeGear();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeGear(); });
document.querySelectorAll(".gear-opt").forEach(function (b) {
  b.addEventListener("click", function () { setMode(b.getAttribute("data-mode")); });
});

$("load-btn").addEventListener("click", loadTarget);
$("target-input").addEventListener("keydown", function (e) { if (e.key === "Enter") loadTarget(); });
$("filter-input").addEventListener("input", function () { state.filter = this.value; renderAll(); });
$("clear-btn").addEventListener("click", function () {
  state.filter = "";
  $("filter-input").value = "";
  renderAll();
});

document.querySelectorAll(".icon-btn").forEach(function (b) {
  b.addEventListener("click", function () {
    var key = b.getAttribute("data-grid");
    var set = state.expanded[key];
    set.clear();
    if (b.getAttribute("data-act") === "expand") {
      (key === "tree" ? state.data.nodes : state.data.affiliates).forEach(function (n) { set.add(n.id); });
    }
    renderAll();
  });
});

/* Target suggestions come from the data provider */
getData().then(function (d) {
  var dl = $("target-list");
  d.nodes.forEach(function (n) {
    var o = document.createElement("option");
    o.value = n.id;
    o.label = n.name;
    dl.appendChild(o);
  });
});
</script>
</body>
</html>
