<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corporate Tree</title>
<style>
  /* Layout: utilitarian tool page. Fixed dark header, toolbars, then two grids. */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --head: #f9fafb; --hover: #f3f4f6;
    --fg: #1a1a2e; --fg-strong: #111827; --fg-2: #374151; --muted: #6b7280; --faint: #9ca3af;
    --border: #e5e7eb; --border-2: #d1d5db;
    --accent: #6366f1; --accent-fg: #4338ca; --err: #dc2626;
    --btn-bg: #1a1a2e; --btn-fg: #ffffff; --btn-hover: #2d2d4e;
    --hdr-bg: #1a1a2e; --hdr-fg: #ffffff; --hdr-muted: #9ca3af; --hdr-accent: #c7d2fe;
    --hdr-border: #4b4b7a; --hdr-hover: rgba(255,255,255,.1);
    --shadow: rgba(0,0,0,.18);
    --pin: #2563eb;
    --restr-bg: #fee2e2; --restr-fg: #b91c1c; --mat-bg: #ffedd5; --mat-fg: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131a; --surface: #1b1d27; --head: #20222d; --hover: #262936;
      --fg: #e6e7ee; --fg-strong: #f3f4f6; --fg-2: #c5c8d4; --muted: #9aa0b0; --faint: #7b8194;
      --border: #2d303d; --border-2: #3a3e4e;
      --accent: #8b8ff5; --accent-fg: #a5a8ff; --err: #f87171;
      --btn-bg: #e6e7ee; --btn-fg: #12131a; --btn-hover: #ffffff;
      --hdr-bg: #0b0c12; --shadow: rgba(0,0,0,.6);
      --pin: #60a5fa;
      --restr-bg: #3d1d22; --restr-fg: #f87171; --mat-bg: #3b2814; --mat-fg: #fb923c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131a; --surface: #1b1d27; --head: #20222d; --hover: #262936;
    --fg: #e6e7ee; --fg-strong: #f3f4f6; --fg-2: #c5c8d4; --muted: #9aa0b0; --faint: #7b8194;
    --border: #2d303d; --border-2: #3a3e4e;
    --accent: #8b8ff5; --accent-fg: #a5a8ff; --err: #f87171;
    --btn-bg: #e6e7ee; --btn-fg: #12131a; --btn-hover: #ffffff;
    --hdr-bg: #0b0c12; --shadow: rgba(0,0,0,.6);
    --pin: #60a5fa;
    --restr-bg: #3d1d22; --restr-fg: #f87171; --mat-bg: #3b2814; --mat-fg: #fb923c;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; background: var(--bg); color: var(--fg); min-height: 100%;
  }
  button { font: inherit; }

  /* ── Header ── */
  #header {
    background: var(--hdr-bg); color: var(--hdr-fg); padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; box-shadow: 0 2px 6px var(--shadow);
  }
  #header-title { font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mode-badge {
    font-size: 11px; color: var(--hdr-accent); border: 1px solid var(--hdr-border); border-radius: 999px;
    padding: 2px 9px; display: none;
  }
  #mode-badge.show { display: inline-block; }
  #node-count { font-size: 12px; color: var(--hdr-muted); white-space: nowrap; }

  /* ── Gear ── */
  #gear-wrap { position: relative; }
  #gear-btn {
    background: none; border: none; color: var(--hdr-muted); cursor: pointer; font-size: 17px;
    width: 28px; height: 28px; border-radius: 6px; line-height: 1; opacity: .75;
    transition: opacity .15s, background .15s, color .15s;
  }
  #gear-btn:hover, #gear-btn[aria-expanded="true"] { opacity: 1; background: var(--hdr-hover); color: var(--hdr-fg); }
  #gear-menu {
    display: none; position: absolute; right: 0; top: 34px; min-width: 170px;
    background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 20px var(--shadow); padding: 4px; z-index: 150;
  }
  #gear-menu.open { display: block; }
  .gear-title { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); font-weight: 600; padding: 6px 10px 4px; }
  .gear-opt {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 10px; border: none; background: none; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--fg-2);
  }
  .gear-opt:hover { background: var(--hover); }
  .gear-opt .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border-2); flex-shrink: 0; }
  .gear-opt.active { color: var(--accent-fg); font-weight: 600; }
  .gear-opt.active .dot { background: var(--accent); border-color: var(--accent); }

  /* ── Toolbars ── */
  .toolbar {
    margin: 10px 20px 0; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  #target-bar { background: none; border: none; padding: 12px 0 0; }
  .toolbar .panel-title { font-size: 12px; font-weight: 600; color: var(--fg-2); margin-right: 4px; white-space: nowrap; }
  .toolbar input[type=text], .toolbar select {
    padding: 7px 12px; border: 1px solid var(--border-2); border-radius: 6px; font: inherit; font-size: 13px;
    background: var(--surface); color: var(--fg); outline: none; transition: border-color .15s;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  #target-input { width: 320px; max-width: 100%; }
  #filter-input { flex: 1; max-width: 420px; }
  .btn {
    padding: 7px 14px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--surface);
    font-size: 13px; cursor: pointer; color: var(--fg-2); transition: background .15s;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); font-weight: 600; }
  .btn.primary:hover { background: var(--btn-hover); }
  #target-err { font-size: 12px; color: var(--err); }
  #report-title { margin: 20px 20px 12px; }
  #report-title h1 { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; color: var(--fg-strong); line-height: 1.25; flex-wrap: wrap; }
  #report-title .pin { width: 22px; height: 22px; flex-shrink: 0; }
  #report-title .node-id { font-size: 16px; font-weight: 400; margin-left: 0; }
  #report-title .footnote { margin-top: 2px; font-size: 12px; color: var(--muted); }

  /* ── Grids ── */
  .section { margin: 16px 20px 0; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .section-head h2 { font-size: 13px; font-weight: 600; color: var(--fg-strong); flex: 1; }
  .section-head .count { font-size: 12px; color: var(--muted); }
  .grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: 420px; }
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th {
    position: sticky; top: 0; background: var(--head); text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.grid td { padding: 4px 12px; border-bottom: 1px solid var(--hover); white-space: nowrap; }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid tr.restricted td { background: var(--restr-bg); }
  table.grid tr.materiality td { background: var(--mat-bg); }
  /* Name and any icon/status columns shrink to their content so they sit together; the filler absorbs the rest. */
  table.grid th.name-col, table.grid td.name-cell, table.grid th.icon-col, table.grid td.icon-col { width: 1%; white-space: nowrap; }
  table.grid th.fill, table.grid td.fill { width: auto; padding: 0; }
  th.pin-col, td.pin-col { width: 28px; padding-left: 10px; padding-right: 0; text-align: center; }
  .pin { display: block; width: 14px; height: 14px; color: var(--pin); }
  .rule-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
  .rule-badge.restricted { color: var(--restr-fg); border: 1px solid var(--restr-fg); }
  .rule-badge.materiality { color: var(--mat-fg); border: 1px solid var(--mat-fg); }
  [hidden] { display: none !important; }
  .toolbar .summary { font-size: 12px; color: var(--muted); margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--border-2);
    background: var(--surface); color: var(--fg); font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  .pill:hover { background: var(--hover); }
  .pill.active { border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  #rule-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .name-inner { display: flex; align-items: center; }
  .indent { display: inline-block; flex-shrink: 0; }
  .toggle {
    width: 18px; height: 18px; flex-shrink: 0; border: none; background: none; cursor: pointer;
    color: var(--muted); font-size: 10px; border-radius: 4px;
  }
  .toggle:hover { background: var(--border); }
  .toggle.leaf { visibility: hidden; cursor: default; }
  .node-name { font-weight: 500; color: var(--fg-strong); margin-left: 2px; }
  .node-id { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .empty { padding: 24px; color: var(--muted); font-size: 13px; }
  #app { display: none; padding-bottom: 40px; }
</style>
</head>
<body>

<div id="header">
  <span id="header-title">Corporate Tree</span>
  <span id="mode-badge"></span>
  <span id="node-count"></span>
  <div id="gear-wrap">
    <button id="gear-btn" title="Settings" aria-haspopup="true" aria-expanded="false">&#9881;</button>
    <div id="gear-menu" role="menu">
      <div class="gear-title">Mode</div>
      <button class="gear-opt active" data-mode="general" role="menuitemradio"><span class="dot"></span>General</button>
      <button class="gear-opt" data-mode="updates" role="menuitemradio"><span class="dot"></span>Tree Updates</button>
      <button class="gear-opt" data-mode="independence" role="menuitemradio"><span class="dot"></span>Independence</button>
    </div>
  </div>
</div>

<!-- General: target company input -->
<div class="toolbar" id="target-bar">
  <label class="panel-title" for="target-input">Target company:</label>
  <input id="target-input" type="text" list="target-list" placeholder="Name or ID, e.g. NW-0002 or Orion" autocomplete="off" />
  <datalist id="target-list"></datalist>
  <select id="provider" hidden>
    <option value="BureauVanDijk">Bureau van Dijk</option>
    <option value="DunAndBradstreet">Dun &amp; Bradstreet</option>
    <option value="Intapp">Intapp</option>
  </select>
  <button class="btn primary" id="load-btn">Load</button>
  <span id="target-err"></span>
</div>

<!-- Report title: target company (shown once loaded) -->
<div id="report-title" hidden>
  <h1 id="report-title-text"></h1>
  <div class="footnote" id="report-footnote"></div>
</div>

<div id="app">
  <!-- Independence (gear) -->
  <div class="toolbar" id="bar-independence" hidden>
    <span class="panel-title">Apply Audit Rule:</span>
    <div id="rule-pills"></div>
    <span class="summary" id="rule-summary"></span>
  </div>

  <!-- General: filter / search -->
  <div class="toolbar" id="filter-bar">
    <label class="panel-title" for="filter-input">Filter:</label>
    <input id="filter-input" type="text" placeholder="Filter by name or ID…" autocomplete="off" />
    <button class="btn" id="clear-btn">Clear</button>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Corporate tree</h2>
      <span class="count" id="tree-count"></span>
    </div>
    <div class="grid-wrap" id="tree-grid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Close affiliates</h2>
      <span class="count" id="aff-count"></span>
    </div>
    <div class="grid-wrap" id="aff-grid"></div>
  </div>
</div>

<script>
/* ═══ DATA PROVIDER ═══════════════════════════════════════════════════════
   Swap this for a live source. Contract:
     getData(target) -> { nodes: [...], affiliates: [...], targetId?: id }
   node:      { id, name, parents: [id, ...] }     (no parents = ultimate owner)
   Optional per-node field:  idParty (id of an Intapp party; present only for entities with a business relationship)
   Computed per node on load (see computeEntityMeta): isTarget, relToTarget, idParty.
   Same id => same values everywhere, tree or close affiliates.
   affiliate: { id, name, parents: [id, ...], idParty? }  (its own hierarchy; include the target in it
              so entities there get "CA - ..." relationships)
   ═══════════════════════════════════════════════════════════════════════ */
var SAMPLE = {
  nodes: [
    { id: "NW-0001", name: "Northwind Global Holdings Inc.", parents: [] },
    { id: "NW-0002", name: "Northwind Americas LLC", parents: ["NW-0001"] },
    { id: "NW-0003", name: "Northwind Capital Partners LP", parents: ["NW-0002"], idParty: "P-20417" },
    { id: "NW-0004", name: "Northwind Real Estate Fund I", parents: ["NW-0003"] },
    { id: "NW-0005", name: "Northwind Real Estate Fund II", parents: ["NW-0003"] },
    { id: "NW-0006", name: "Northwind Canada Ltd.", parents: ["NW-0002"] },
    { id: "NW-0007", name: "Northwind Europe plc", parents: ["NW-0001"] },
    { id: "NW-0008", name: "Northwind UK Services Ltd", parents: ["NW-0007"], idParty: "P-31882" },
    { id: "NW-0009", name: "Northwind Deutschland GmbH", parents: ["NW-0007"] },
    { id: "NW-0010", name: "Northwind France SAS", parents: ["NW-0007"] },
    { id: "NW-0011", name: "Northwind Asia Pacific Pte. Ltd.", parents: ["NW-0001"] },
    { id: "NW-0012", name: "Northwind Japan K.K.", parents: ["NW-0011"] },
    { id: "NW-0013", name: "Northwind Australia Pty Ltd", parents: ["NW-0011"] },
    { id: "KG-0001", name: "Kestrel Group SA", parents: [], idParty: "P-10552" },
    { id: "KG-0002", name: "Kestrel Industrial Holdings", parents: ["KG-0001"] },
    { id: "JV-0001", name: "Orion Industrial JV", parents: ["NW-0011", "KG-0002"], idParty: "P-44071" },
    { id: "JV-0002", name: "Orion Logistics Ltd", parents: ["JV-0001"] }
  ],
  affiliates: [
    { id: "NW-0001", name: "Northwind Global Holdings Inc.", parents: [] },
    { id: "NW-0002", name: "Northwind Americas LLC", parents: ["NW-0001"] },
    { id: "NW-0003", name: "Northwind Capital Partners LP", parents: ["NW-0002"], idParty: "P-20417" },
    { id: "NW-0004", name: "Northwind Real Estate Fund I", parents: ["NW-0003"] },
    { id: "NW-0007", name: "Northwind Europe plc", parents: ["NW-0001"] },
    { id: "AF-0001", name: "Harbor Advisory Group", parents: [], idParty: "P-50219" },
    { id: "AF-0002", name: "Harbor Trust Co.", parents: ["AF-0001"] }
  ]
};

/* Live data comes from the Intapp host, which injects window.celeste.
   Anywhere else (a browser tab, the published artifact) the sample is used. */
function isLive() { return typeof window.celeste !== "undefined"; }

function extractObj(raw, key) {
  if (!raw) return null;
  if (typeof raw === "object" && !Array.isArray(raw) && (!key || key in raw)) return raw;
  if (Array.isArray(raw)) {
    for (var i = 0; i < raw.length; i++) {
      var b = raw[i];
      var v = (b && b.text != null) ? b.text : (b && b.content != null) ? b.content : (b && b.value != null) ? b.value : (b && b.data != null) ? b.data : b;
      if (typeof v === "string") {
        try { var p = JSON.parse(v); if (!key || key in p) return p; } catch (e) {}
      }
      if (v && typeof v === "object" && !Array.isArray(v)) {
        if (!key || key in v) return v;
        var envs = ["result", "data", "value", "payload"];
        for (var j = 0; j < envs.length; j++) {
          if (v[envs[j]] && typeof v[envs[j]] === "object" && (!key || key in v[envs[j]])) return v[envs[j]];
        }
      }
    }
  }
  if (typeof raw === "string") {
    try { var p2 = JSON.parse(raw); if (!key || key in p2) return p2; } catch (e2) {}
  }
  return null;
}

/* Merge a provider hierarchy into one node per id. An entity placed under several parents (or in several
   trees) keeps all of them in `parents`; a node is only skipped when it is already in its own ancestry. */
function mergeHierarchy(root, map, idOf, nameOf, kidsOf) {
  (function walk(node, parentId, stack) {
    var id = node && idOf(node);
    if (!id || stack.indexOf(id) !== -1) return;
    var rec = map.get(id);
    if (!rec) { rec = { id: id, name: nameOf(node) || id, parents: [] }; map.set(id, rec); }
    if (parentId && rec.parents.indexOf(parentId) === -1) rec.parents.push(parentId);
    var next = stack.concat(id);
    (kidsOf(node) || []).forEach(function (k) { walk(k, id, next); });
  })(root, null, []);
}

function loadLive(partyId) {
  var provider = $("provider").value;
  return celeste.query("intapp_compliance__get_party", { partyId: partyId, propertiesToLoad: ["CorporateFamily"] })
    .then(function (raw) {
      var party = extractObj(raw, "partyId");
      if (!party) throw new Error("Could not load party " + partyId + ".");

      /* The target is the party itself, identified by its provider id (not the tree root). */
      var targetId = (provider === "BureauVanDijk" ? party.bureauVanDijkId
                    : provider === "DunAndBradstreet" ? party.dunsNumber : party.externalId)
        || party.externalId || party.bureauVanDijkId || party.dunsNumber || party.partyId;

      var treeNode = function (n) { return n.externalId || n.key || null; };
      var treeName = function (n) { return n.name || n.displayName || n.nameWithoutHonorifics; };
      var treeKids = function (n) { return n.subCompanies || n.children || []; };

      var map = new Map();
      var all = party.corporateTrees || [];
      var trees = all.filter(function (t) { return t.providerType === provider; });
      (trees.length ? trees : all).forEach(function (t) {
        if (t.rootCompany) mergeHierarchy(t.rootCompany, map, treeNode, treeName, treeKids);
      });

      /* Close affiliates arrive as their own nested hierarchy (id / name / closeAffiliates) */
      var aff = new Map();
      var ca = party.closeAffiliates && party.closeAffiliates.closeAffiliates;
      (ca || []).forEach(function (r) {
        mergeHierarchy(r, aff, function (n) { return n.id; }, function (n) { return n.name; }, function (n) { return n.closeAffiliates; });
      });
      var affiliates = Array.from(aff.values());

      if (map.size) {
        return { nodes: Array.from(map.values()), affiliates: affiliates, targetId: targetId };
      }

      if (!targetId) throw new Error("Party " + (party.name || partyId) + " has no external ID for " + provider + ".");
      return celeste.query("intapp_compliance__load_corporate_tree_data", { externalId: targetId, provider: provider })
        .then(function (r2) {
          var td = extractObj(r2, "corporateTrees");
          ((td && td.corporateTrees) || []).forEach(function (t) { mergeHierarchy(t, map, treeNode, treeName, treeKids); });
          if (!map.size) throw new Error("Corporate tree was empty for " + (party.name || partyId) + ".");
          return { nodes: Array.from(map.values()), affiliates: affiliates, targetId: targetId };
        });
    });
}

/* Sample datasets: the built-in one, plus any a host page supplies as window.EXTRA_SAMPLES
   (each { nodes, affiliates, targetId }). The one containing the typed target is used. */
function sampleSets() { return [SAMPLE].concat(window.EXTRA_SAMPLES || []); }

function pickSample(query) {
  var q = (query || "").trim().toLowerCase();
  if (!q) return SAMPLE;
  var hit = sampleSets().filter(function (set) {
    return set.nodes.some(function (n) { return n.id.toLowerCase() === q || n.name.toLowerCase().indexOf(q) !== -1; });
  })[0];
  return hit || SAMPLE;
}

function getData(target) {
  return isLive() ? loadLive((target || "").trim()) : Promise.resolve(pickSample(target));
}

/* ═══ STATE ═══════════════════════════════════════════════════════════ */
var MODES = {
  general:      { label: "General" },
  updates:      { label: "Tree Updates" },
  independence: { label: "Independence" }
};
/* Audit rules. Driven only by each entity's relToTarget metadata (the target has none, so it is not marked).
   Each rule says what its relationship groups are: "restricted", "materiality", or null (out of scope).
     parent  : Ultimate / Immediate / Indirect Parent
     sub     : Immediate / Indirect Subsidiary
     common  : Sibling, Cousin (common control)
     sigInfl : any CA - label (close affiliates = significant influence)
   Every relToTarget label is scored on its own and the strictest result wins
   (restricted > materiality > out of scope), so an entity that is both a tree relative and a close
   affiliate takes whichever is stricter. Source: jurisdiction screening guide;
   the guide's "not confirmed" items are noted per rule. */
var RULES = [
  { key: "SEC", label: "SEC", parent: "restricted", sub: "restricted", common: "materiality", sigInfl: "materiality",
    cite: "17 CFR 210.2-01(f)(4). Parents and subsidiaries restricted; siblings, cousins and significant influence (close affiliates) need a materiality test." },
  { key: "AICPA", label: "AICPA", parent: "restricted", sub: "restricted", common: "materiality", sigInfl: "materiality",
    cite: "ET 0.400.02. Subsidiaries restricted; siblings, cousins and significant influence (close affiliates) materiality check. Parent treatment not confirmed (shown as restricted)." },
  { key: "IESBA-PIE", label: "IESBA (PIE)", parent: "materiality", sub: "restricted", common: "materiality", sigInfl: "materiality",
    cite: "IESBA related entities, PIE. Subsidiaries restricted; parents, siblings and cousins materiality check. Significant influence not confirmed (shown as materiality check)." },
  { key: "IESBA", label: "IESBA", parent: null, sub: "restricted", common: null, sigInfl: "materiality",
    cite: "IESBA related entities, non-PIE. Subsidiaries restricted; parents, siblings and cousins out of scope (likely). Significant influence not confirmed (shown as materiality check)." },
  { key: "EU", label: "EU", parent: "restricted", sub: "restricted", common: null, sigInfl: null,
    cite: "Regulation (EU) 537/2014, Art. 5. Parent and controlled undertakings restricted; siblings, cousins and significant influence (close affiliates) out of scope. Geography not applied." },
  { key: "UK", label: "UK", parent: "restricted", sub: "restricted", common: null, sigInfl: null,
    cite: "FRC Ethical Standard, UK 537/2014. Parent and subsidiary undertakings restricted; siblings, cousins and significant influence (close affiliates) out of scope." }
];
var REL_GROUP = {
  "Ultimate Parent": "parent", "Immediate Parent": "parent", "Indirect Parent": "parent",
  "Immediate Subsidiary": "sub", "Indirect Subsidiary": "sub",
  "Sibling": "common", "Cousin": "common"
};
var LEVEL_RANK = { restricted: 2, materiality: 1 };

/* Group for one relToTarget label */
function relGroup(r) { return r.indexOf(AFF_PREFIX) === 0 ? "sigInfl" : REL_GROUP[r]; }

/* "restricted" | "materiality" | null (not part of the rule) for one entity under one rule */
function screen(node, rule) {
  var level = null;
  (node.relToTarget || []).forEach(function (r) {
    var l = rule[relGroup(r)];
    if (l && (!level || LEVEL_RANK[l] > LEVEL_RANK[level])) level = l;
  });
  return level;
}

function activeRule() {
  if (state.mode !== "independence" || !state.auditRule) return null;
  return RULES.filter(function (r) { return r.key === state.auditRule; })[0] || null;
}

var state = {
  mode: "general",
  auditRule: null,
  data: null,
  target: null,
  owners: [],
  filter: "",
  expanded: { tree: new Set(), aff: new Set() }
};

var $ = function (id) { return document.getElementById(id); };

/* ═══ HELPERS ═════════════════════════════════════════════════════════ */
function indexNodes(list, parentsOf) {
  var byId = new Map(), kids = new Map();
  list.forEach(function (n) { byId.set(n.id, n); });
  list.forEach(function (n) {
    parentsOf(n).forEach(function (p) {
      if (!byId.has(p)) return;
      if (!kids.has(p)) kids.set(p, []);
      kids.get(p).push(n);
    });
  });
  return { byId: byId, kids: kids };
}

function ancestorsOf(id, idx, parentsOf) {
  var out = new Set(), stack = [id];
  while (stack.length) {
    var n = idx.byId.get(stack.pop());
    if (!n) continue;
    parentsOf(n).forEach(function (p) {
      if (idx.byId.has(p) && !out.has(p)) { out.add(p); stack.push(p); }
    });
  }
  return out;
}

function resolveTarget(query, nodes) {
  var q = query.trim().toLowerCase();
  if (!q) return null;
  var exact = nodes.filter(function (n) { return n.id.toLowerCase() === q || n.name.toLowerCase() === q; });
  if (exact.length) return exact[0];
  var partial = nodes.filter(function (n) { return n.name.toLowerCase().indexOf(q) !== -1; });
  return partial.length ? partial[0] : null;
}

/* ═══ ENTITY METADATA ═════════════════════════════════════════════════
   Stored on each tree node; nothing in the UI reads it yet.
     isTarget       boolean, true for the target company
     relToTarget    array of labels (Ultimate Parent, Immediate Parent, Indirect Parent,
                    Immediate Subsidiary, Indirect Subsidiary, Sibling, Cousin) in that order.
                    An entity holds every label any of its placements supports.
     idParty        Intapp party id, or null when the entity has no party record
   Classification follows entity-relationship-classification.md.
   ═══════════════════════════════════════════════════════════════════ */
var REL_ORDER = ["Ultimate Parent", "Immediate Parent", "Indirect Parent",
                 "Immediate Subsidiary", "Indirect Subsidiary", "Sibling", "Cousin"];

/* Every upward path from id, as arrays [id, parent, ..., top]. A path stops at a repeat (cycle guard). */
function upwardPaths(id, byId) {
  var out = [];
  (function walk(path) {
    var n = byId.get(path[path.length - 1]);
    var ps = n ? n.parents.filter(function (p) { return byId.has(p) && path.indexOf(p) === -1; }) : [];
    if (!ps.length) { out.push(path); return; }
    ps.forEach(function (p) { walk(path.concat(p)); });
  })([id]);
  return out;
}

/* Classify every node in one hierarchy relative to the target: id -> Set of REL_ORDER labels.
   If the target is not in this hierarchy nothing in it is related to it. */
function classify(nodes, targetId) {
  var byId = new Map(), result = new Map();
  nodes.forEach(function (n) { byId.set(n.id, n); });
  if (!byId.has(targetId)) return result;
  var tPaths = upwardPaths(targetId, byId);

  nodes.forEach(function (n) {
    if (n.id === targetId) return;
    var rels = result.get(n.id) || new Set();
    result.set(n.id, rels);
    var isRoot = !n.parents.some(function (p) { return byId.has(p); });

    /* Above the target: n appears on a path up from the target */
    tPaths.forEach(function (path) {
      var d = path.indexOf(n.id);
      if (d < 1) return;
      if (isRoot) rels.add("Ultimate Parent");
      if (d === 1) rels.add("Immediate Parent");
      else if (!isRoot) rels.add("Indirect Parent");
    });

    upwardPaths(n.id, byId).forEach(function (ep) {
      /* Below the target: the target appears on a path up from n */
      var d = ep.indexOf(targetId);
      if (d >= 1) rels.add(d === 1 ? "Immediate Subsidiary" : "Indirect Subsidiary");

      /* Sibling / Cousin: for each pair of placements, the lowest common ancestor on those two paths */
      tPaths.forEach(function (tp) {
        for (var dt = 0; dt < tp.length; dt++) {
          var de = ep.indexOf(tp[dt]);
          if (de === -1) continue;
          if (dt > 0 && de > 0) rels.add(dt === 1 && de === 1 ? "Sibling" : "Cousin");
          break; /* first shared node is the lowest; one is an ancestor of the other if either index is 0 */
        }
      });
    });
  });
  return result;
}

var AFF_PREFIX = "CA - ";

/* Metadata is per entity id: every node with the same id, in the tree or in close affiliates,
   gets the same values. Tree labels come first, then the same labels prefixed with "CA - ". */
function computeEntityMeta(nodes, affiliates, targetId) {
  var treeRels = classify(nodes, targetId);
  var affRels = classify(affiliates, targetId);
  var everyone = nodes.concat(affiliates);

  var parties = new Map();
  everyone.forEach(function (n) {
    if (n.idParty && !parties.has(n.id)) parties.set(n.id, n.idParty);
  });

  var meta = new Map();
  everyone.forEach(function (n) {
    if (meta.has(n.id)) return;
    var t = treeRels.get(n.id), a = affRels.get(n.id);
    var rels = REL_ORDER.filter(function (r) { return t && t.has(r); })
      .concat(REL_ORDER.filter(function (r) { return a && a.has(r); }).map(function (r) { return AFF_PREFIX + r; }));
    meta.set(n.id, { isTarget: n.id === targetId, relToTarget: rels, idParty: parties.get(n.id) || null });
  });

  everyone.forEach(function (n) {
    var m = meta.get(n.id);
    n.isTarget = m.isTarget;
    n.relToTarget = m.relToTarget;
    n.idParty = m.idParty;
  });
}

/* ═══ LOAD TARGET ═════════════════════════════════════════════════════ */
function loadTarget() {
  var err = $("target-err");
  err.textContent = "";
  var query = $("target-input").value;
  if (!query.trim()) { err.textContent = "Enter a target company."; return; }

  getData(query).then(function (data) {
    var target = (data.targetId && data.nodes.filter(function (n) { return n.id === data.targetId; })[0]) || resolveTarget(query, data.nodes);
    if (!target) { err.textContent = "No company found for “" + query.trim() + "”."; return; }

    var idx = indexNodes(data.nodes, function (n) { return n.parents; });
    var anc = ancestorsOf(target.id, idx, function (n) { return n.parents; });
    var chain = anc.size ? Array.from(anc) : [];
    /* Ultimate owners: ancestors (or the target itself) with no parents */
    var owners = (chain.length ? chain : [target.id])
      .map(function (id) { return idx.byId.get(id); })
      .filter(function (n) { return n.parents.length === 0; });

    computeEntityMeta(data.nodes, data.affiliates, target.id);
    state.data = data;
    state.target = target;
    state.owners = owners;
    state.expanded.tree = new Set();
    state.expanded.aff = new Set();
    state.filter = "";
    $("filter-input").value = "";

    /* Default expansion: path from each owner down to the target */
    owners.forEach(function (o) { state.expanded.tree.add(o.id); });
    anc.forEach(function (id) { state.expanded.tree.add(id); });
    /* Close affiliates: open the chain down to the target so its pin is visible */
    var affIdx0 = indexNodes(data.affiliates, function (n) { return n.parents; });
    ancestorsOf(target.id, affIdx0, function (n) { return n.parents; }).forEach(function (id) { state.expanded.aff.add(id); });

    $("app").style.display = "block";
    renderTitle();
    renderAll();
  }).catch(function (e) { err.textContent = e.message; });
}

/* Report title: pin, Name (ID); footnote names the tree(s) when the target is not an ultimate owner */
function renderTitle() {
  var t = state.target, h = $("report-title-text");
  h.innerHTML = "";
  h.appendChild(pinIcon());
  var nm = document.createElement("span");
  nm.textContent = t.name;
  h.appendChild(nm);
  var id = document.createElement("span");
  id.className = "node-id";
  id.textContent = "(" + t.id + ")";
  h.appendChild(id);

  var isOwner = state.owners.some(function (o) { return o.id === t.id; });
  var foot = $("report-footnote");
  if (isOwner) {
    foot.textContent = "";
  } else {
    var names = state.owners.map(function (o) { return o.name + " (" + o.id + ")"; });
    foot.textContent = "Part of the " + names.join(" and ") + (names.length > 1 ? " trees" : " tree");
  }
  $("report-title").hidden = false;
}

/* ═══ GRID RENDERER ═══════════════════════════════════════════════════
   One renderer for both grids: expand/collapse toggle, indent, name, id,
   plus extra columns contributed by the active mode.
   ═══════════════════════════════════════════════════════════════════ */
/* Blue map pin marking the target company wherever it appears */
function pinIcon() {
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "pin");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Target company");
  var title = document.createElementNS(ns, "title");
  title.textContent = "Target company";
  svg.appendChild(title);
  var path = document.createElementNS(ns, "path");
  path.setAttribute("fill", "currentColor");
  path.setAttribute("d", "M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z");
  svg.appendChild(path);
  return svg;
}

/* Mode-specific columns: Independence adds the audit rule result. */
function extraColumns() {
  var rule = activeRule();
  if (!rule) return [];
  var LABELS = { restricted: "Restricted", materiality: "Materiality check" };
  return [{
    title: rule.label,
    cell: function (n, td) {
      var level = screen(n, rule);
      if (!level) return;
      var b = document.createElement("span");
      b.className = "rule-badge " + level;
      b.textContent = LABELS[level];
      td.appendChild(b);
    }
  }];
}

/* gridKey: "tree" | "aff"; roots/idx/parentsOf describe the structure */
function renderGrid(gridKey, containerId, countId, nodes, roots, parentsOf) {
  var idx = indexNodes(nodes, parentsOf);
  var txt = state.filter.trim().toLowerCase();
  var filtering = !!txt;

  /* Visible set = matches + their ancestors; filtering force-expands */
  var visible = null;
  if (filtering) {
    visible = new Set();
    nodes.forEach(function (n) {
      if (n.group) return;
      var hit = (!txt || (n.name + " " + n.id).toLowerCase().indexOf(txt) !== -1);
      if (!hit) return;
      visible.add(n.id);
      ancestorsOf(n.id, idx, parentsOf).forEach(function (a) { visible.add(a); });
    });
  }

  var cols = extraColumns();
  var table = document.createElement("table");
  table.className = "grid";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  var pinTh = document.createElement("th");
  pinTh.className = "pin-col";
  pinTh.setAttribute("aria-label", "Target company");
  hr.appendChild(pinTh);

  /* Expand/collapse everything in this grid */
  var expandable = [];
  idx.kids.forEach(function (list, id) { if (list.length) expandable.push(id); });
  var allOpen = expandable.length > 0 && expandable.every(function (id) { return state.expanded[gridKey].has(id); });
  var nameTh = document.createElement("th");
  nameTh.className = "name-col";
  if (expandable.length) {
    var all = document.createElement("button");
    all.className = "toggle";
    all.textContent = allOpen ? "\u25BE" : "\u25B8";
    all.title = allOpen ? "Collapse all" : "Expand all";
    all.setAttribute("aria-label", all.title);
    all.addEventListener("click", function () {
      var set = state.expanded[gridKey];
      if (allOpen) set.clear();
      else expandable.forEach(function (id) { set.add(id); });
      renderAll();
    });
    nameTh.appendChild(all);
  }
  hr.appendChild(nameTh);

  cols.forEach(function (c) {
    var th = document.createElement("th");
    th.className = "icon-col";
    th.textContent = c.title;
    hr.appendChild(th);
  });
  var fillTh = document.createElement("th");
  fillTh.className = "fill";
  hr.appendChild(fillTh);
  thead.appendChild(hr);
  table.appendChild(thead);

  var tbody = document.createElement("tbody");
  var shown = 0;

  function walk(node, depth, trail) {
    if (visible && !visible.has(node.id)) return;
    if (trail.indexOf(node.id) !== -1) return; /* cycle guard */
    var kids = (idx.kids.get(node.id) || []).filter(function (k) { return !visible || visible.has(k.id); });
    var open = filtering || state.expanded[gridKey].has(node.id);
    shown++;

    var tr = document.createElement("tr");
    if (node.group) tr.className = "group";
    var ruleNow = activeRule();
    if (ruleNow) {
      var lvl = screen(node, ruleNow);
      if (lvl) tr.className = lvl;
    }

    var pinTd = document.createElement("td");
    pinTd.className = "pin-col";
    if (node.isTarget) pinTd.appendChild(pinIcon());
    tr.appendChild(pinTd);

    var nameTd = document.createElement("td");
    nameTd.className = "name-cell";
    var inner = document.createElement("div");
    inner.className = "name-inner";
    nameTd.appendChild(inner);
    var ind = document.createElement("span");
    ind.className = "indent";
    ind.style.width = (depth * 20) + "px";
    inner.appendChild(ind);

    var tg = document.createElement("button");
    tg.className = "toggle" + (kids.length ? "" : " leaf");
    tg.textContent = open ? "▾" : "▸";
    tg.setAttribute("aria-label", open ? "Collapse" : "Expand");
    if (kids.length) {
      tg.addEventListener("click", function () {
        var set = state.expanded[gridKey];
        if (set.has(node.id)) set.delete(node.id); else set.add(node.id);
        renderAll();
      });
    }
    inner.appendChild(tg);

    var nm = document.createElement("span");
    nm.className = "node-name";
    nm.textContent = node.name;
    nm.title = JSON.stringify({ isTarget: node.isTarget, relToTarget: node.relToTarget, idParty: node.idParty }, null, 2);
    inner.appendChild(nm);
    var idSp = document.createElement("span");
    idSp.className = "node-id";
    idSp.textContent = "(" + node.id + ")";
    inner.appendChild(idSp);
    tr.appendChild(nameTd);


    cols.forEach(function (c) {
      var td = document.createElement("td");
      td.className = "icon-col";
      if (!node.group) c.cell(node, td);
      tr.appendChild(td);
    });
    var fillTd = document.createElement("td");
    fillTd.className = "fill";
    tr.appendChild(fillTd);
    tbody.appendChild(tr);

    if (open) kids.forEach(function (k) { walk(k, depth + 1, trail.concat(node.id)); });
  }

  roots.forEach(function (r) { walk(r, 0, []); });
  table.appendChild(tbody);

  var host = $(containerId);
  host.innerHTML = "";
  if (!shown) {
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No matching entities.";
    host.appendChild(e);
  } else {
    host.appendChild(table);
  }
  var real = 0;
  nodes.forEach(function (n) { if (!n.group) real++; });
  $(countId).textContent = (filtering ? "filtered · " : "") + real + " entities";
  return idx;
}

/* ═══ RENDER ALL ══════════════════════════════════════════════════════ */
function renderAll() {
  if (!state.data) return;

  /* Tree grid: only the tree(s) beneath the ultimate owner(s) */
  var allIdx = indexNodes(state.data.nodes, function (n) { return n.parents; });
  var inTree = new Set();
  (function collect(list) {
    list.forEach(function (n) {
      if (inTree.has(n.id)) return;
      inTree.add(n.id);
      collect(allIdx.kids.get(n.id) || []);
    });
  })(state.owners);
  var treeNodes = state.data.nodes.filter(function (n) { return inTree.has(n.id); });
  renderGrid("tree", "tree-grid", "tree-count", treeNodes, state.owners, function (n) { return n.parents; });

  /* Close affiliates grid */
  var affNodes = state.data.affiliates;
  var affIdx = indexNodes(affNodes, function (n) { return n.parents; });
  var affRoots = affNodes.filter(function (n) { return !n.parents.some(function (p) { return affIdx.byId.has(p); }); });
  renderGrid("aff", "aff-grid", "aff-count", affNodes, affRoots, function (n) { return n.parents; });

  $("node-count").textContent = treeNodes.length + " in tree · " +
    affNodes.length + " affiliates";
  renderRuleBar();
}

function renderRuleBar() {
  var bar = $("bar-independence");
  bar.hidden = state.mode !== "independence";
  if (bar.hidden) return;
  var host = $("rule-pills");
  host.innerHTML = "";
  RULES.forEach(function (r) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pill" + (state.auditRule === r.key ? " active" : "");
    b.textContent = r.label;
    b.title = r.cite;
    b.setAttribute("aria-pressed", state.auditRule === r.key ? "true" : "false");
    b.addEventListener("click", function () {
      state.auditRule = state.auditRule === r.key ? null : r.key;
      renderAll();
    });
    host.appendChild(b);
  });

  var rule = activeRule(), sum = $("rule-summary");
  if (!state.data) { sum.textContent = "Load a target company first."; return; }
  if (!rule) { sum.textContent = "Select a rule to mark restricted and materiality-check entities."; return; }
  var seen = new Set(), c = { restricted: 0, materiality: 0 };
  state.data.nodes.concat(state.data.affiliates).forEach(function (n) {
    if (seen.has(n.id)) return;
    seen.add(n.id);
    var l = screen(n, rule);
    if (l) c[l]++;
  });
  sum.textContent = c.restricted + " restricted \u00B7 " + c.materiality + " materiality check";
}

/* ═══ MODES (gear) — selection only; features land per mode later ═══ */
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".gear-opt").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-mode") === mode);
  });
  var badge = $("mode-badge");
  badge.textContent = MODES[mode].label;
  badge.classList.toggle("show", mode !== "general");
  closeGear();
  renderAll();
  renderRuleBar(); /* also runs before any target is loaded */
}

function closeGear() {
  $("gear-menu").classList.remove("open");
  $("gear-btn").setAttribute("aria-expanded", "false");
}

/* ═══ WIRING ══════════════════════════════════════════════════════════ */
$("gear-btn").addEventListener("click", function (e) {
  e.stopPropagation();
  var open = $("gear-menu").classList.toggle("open");
  this.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", function (e) {
  if (!$("gear-wrap").contains(e.target)) closeGear();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeGear(); });
document.querySelectorAll(".gear-opt").forEach(function (b) {
  b.addEventListener("click", function () { setMode(b.getAttribute("data-mode")); });
});

$("load-btn").addEventListener("click", loadTarget);
$("target-input").addEventListener("keydown", function (e) { if (e.key === "Enter") loadTarget(); });
$("filter-input").addEventListener("input", function () { state.filter = this.value; renderAll(); });
$("clear-btn").addEventListener("click", function () {
  state.filter = "";
  $("filter-input").value = "";
  renderAll();
});


/* Sample mode suggests its IDs; live mode takes a Party ID and a provider. */
if (isLive()) {
  $("provider").hidden = false;
  $("target-input").placeholder = "Party ID, e.g. 1096";
  $("target-input").removeAttribute("list");
} else {
  sampleSets().forEach(function (set, i) {
    var list = i === 0 ? set.nodes : set.nodes.filter(function (n) { return n.id === set.targetId; });
    list.forEach(function (n) {
      var o = document.createElement("option");
      o.value = n.id;
      o.label = n.name;
      $("target-list").appendChild(o);
    });
  });
}
</script>
