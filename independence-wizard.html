/* Fold the SI entities (close-affiliate-only relationships) into the tree grid. An SI entity is added, with what sits
   below it in the close-affiliate hierarchy, wherever its parent/id pair is not already in the grid. An SI ultimate
   owner above the tree's own ultimate owner goes on top of that tree; any other SI ultimate owner becomes its own
   level-0 company with everything underneath it. */
function mergeAffiliates(trees, affTrees, si) {
  var roots = trees.slice(), host = new Map(), pairs = new Set();
  function copy(p) { return { id: p.id, name: p.name, children: p.children.map(copy) }; }
  function index(list, pid) {
    list.forEach(function (p) {
      pairs.add(pid + "|" + p.id);
      if (!host.has(p.id)) host.set(p.id, p);
      index(p.children, p.id);
    });
  }
  function visit(p) {
    p.children.forEach(function (c) {
      if (si.has(c.id) && !pairs.has(p.id + "|" + c.id) && host.has(p.id)) {
        var k = copy(c);
        host.get(p.id).children.push(k);
        index([k], p.id);
      } else visit(c);
    });
  }
  index(roots, "");
  affTrees.forEach(function (r) {
    if (!si.has(r.id) || host.has(r.id)) { visit(r); return; }
    var top = { id: r.id, name: r.name, children: [] }, first = -1;
    r.children.forEach(function (c) {
      var at = roots.map(function (x) { return x.id; }).indexOf(c.id);
      if (at !== -1) { top.children.push(roots[at]); roots.splice(at, 1, null); if (first === -1) first = at; }
      else top.children.push(copy(c));
    });
    if (first === -1) roots.push(top); else roots[first] = top;
    roots = roots.filter(Boolean);
    pairs = new Set(); host = new Map(); index(roots, "");
    visit(r);
  });
  return roots;
}

/* ═══ STEP 1: FIND THE PARTY AND ITS TREE ═════════════════════════════════ */
function setFamily(data) {
  var target = data.nodes.filter(function (n) { return n.id === data.targetId; })[0];
  if (!target) throw new Error("This party is not in a corporate tree.");

  annotate(data.trees, target.id);
  /* Ultimate owners: the roots of the trees that contain the target */
  var shown = data.trees.filter(function (r) { return r.hasTarget; });
  if (!shown.length) shown = data.trees;

  computeEntityMeta(data.nodes, data.affiliates, target.id);
  state.data = data;
  state.target = target;
  state.owners = shown.map(function (r) { return { id: r.id, name: r.name }; });
  state.trees = mergeAffiliates(shown, data.affTrees, new Set(data.nodes.concat(data.affiliates).filter(siOnly).map(function (n) { return n.id; })));
  annotate(state.trees, target.id);

  var seen = new Set();
  (function count(list) { list.forEach(function (pl) { seen.add(pl.id); count(pl.children); }); })(shown);
  state.treeCount = seen.size;

  /* A new party starts every later step over */
  state.byParty = null;
  state.matters = null;
  state.unmatched = [];
  state.engage = null;
  state.engInfo = null;
  state.engNotes = [];
  state.rulesRun = false;
  state.rowsTouched = false;
  state.assessment = null;
  state.auditRows = [{ client: null, rule: null, on: true }];
  state.expanded = { tree: new Set() };

  /* Default expansion: every placement on a path down to the target, in both grids */
  (function open(list) {
    list.forEach(function (pl) {
      if (pl.hasTarget && pl.id !== target.id) state.expanded.tree.add(pl.key);
      open(pl.children);
    });
  })(state.trees);
}

/* "Part of the Name (ID) Corporate Tree" */
var TREE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M12 12H5v4.5M12 12h7v4.5"/></svg>';
function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }

/* The title page: the party, its tree, and how many audit and non-audit relationships it and the rest of the tree have */
function renderFacts() {
  var t = state.target, host = $("party-facts"), m = state.matters;
  host.innerHTML = "";
  var add = function (icon, title, sub) {
    var row = el("div", "fact"), ic = el("span", "fact-ic"), tx = el("div");
    if (typeof icon === "string") ic.innerHTML = icon; else ic.appendChild(icon);
    tx.appendChild(el("div", "fact-t", title));
    tx.appendChild(el("div", "fact-s", sub));
    row.appendChild(ic);
    row.appendChild(tx);
    host.appendChild(row);
  };
  var many = state.owners.length > 1, isOwner = state.owners.some(function (o) { return o.id === t.id; });
  add(TREE_ICON, state.owners.map(function (o) { return o.name + " (" + o.id + ")"; }).join(" and "),
      (isOwner ? "Ultimate owner of a" : "Part of a") + " corporate tree" + (many ? "s" : "") + " with " + plural(state.treeCount, "entity", "entities"));
  [["audit", "audit", "Audit"], ["non", "non-audit", "Non-audit"]].forEach(function (k) {
    var mine = m && m[k[0]], others = m && m[k[0] + "Others"];
    add(engIcon(k[0]), m ? plural(mine, k[1] + " relationship") : k[2] + " relationships",
        m ? (others ? plural(others, "other tree entity", "other tree entities") + " with " + k[1] + " relationships" : "No other tree entities with " + k[1] + " relationships")
          : "Could not be loaded yet; the next step tries again");
  });
}

/* ═══ STEP 2: AUDIT RELATIONSHIPS AND RULES ═══════════════════════════════
   The tree is master: matters for anyone who is not in it are ignored. Notes are read only for engaged parties. */
/* The engagement group is named for the tree's ultimate owner and holds the Party, Client and Matter records for the
   whole family, close affiliates included. Each is matched to an entity in the grid (tree and close affiliates) by its
   id, or failing that by its name. Anything that matches nothing is listed on the engagement step. */
function loadMatters() {
  var data = state.data, ents = everyNode(), inTree = new Set(ents.map(function (n) { return n.id; }));
  var norm = function (t) { return String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); };
  var byName = new Map();
  ents.forEach(function (n) { if (!byName.has(norm(n.name))) byName.set(norm(n.name), n.id); });
  return Promise.all(state.owners.map(function (o) {
    return callTool("get_component_group", { componentGroupName: o.id })
      .then(function (raw) { var g = extractObj(raw, "groupMembers"); return (g && g.groupMembers) || []; })
      .catch(function () { return []; });
  })).then(function (lists) {
    var members = [].concat.apply([], lists).filter(Boolean);
    if (!members.length) return;

    var entity = new Map(), names = new Map(), partyIds = new Set(), partyOf = new Map(); /* group id -> grid entity id */
    members.forEach(function (m) {
      var gid = m.type === "Party" ? m.partyId : m.type === "Client" ? m.clientId : null;
      if (!gid) return;
      names.set(gid, m.name);
      var eid = inTree.has(gid) ? gid : byName.get(norm(m.name));
      if (eid) entity.set(gid, eid);
      if (eid && m.type === "Party") { partyIds.add(eid); partyOf.set(eid, gid); }
    });
    var byParty = new Map(), lost = new Map();
    members.forEach(function (m) {
      if (m.type !== "Matter" || !m.clientId || !m.name) return;
      var eid = inTree.has(m.clientId) ? m.clientId : entity.get(m.clientId);
      if (!eid) { lost.set(m.clientId, names.get(m.clientId) || m.clientId); return; }
      if (!byParty.has(eid)) byParty.set(eid, []);
      byParty.get(eid).push({ id: m.matterId, name: m.name });
    });
    /* Parties known to Intapp are shown in bold */
    ents.forEach(function (n) { if (partyIds.has(n.id)) n.idParty = n.id; });
    computeEntityMeta(data.nodes, data.affiliates, state.target.id);
    state.byParty = byParty;
    state.partyOf = partyOf;
    state.unmatched = Array.from(lost.keys()).map(function (k) { return lost.get(k) + (lost.get(k) === k ? "" : " (" + k + ")"); });

    var c = { audit: 0, non: 0, auditOthers: 0, nonOthers: 0 };
    byParty.forEach(function (ms, id) {
      var a = ms.filter(function (x) { return isAuditMatter(x.name); }).length, n = ms.length - a;
      if (id === state.target.id) { c.audit = a; c.non = n; } else { if (a) c.auditOthers++; if (n) c.nonOthers++; }
    });
    state.matters = c;
  });
}

function findEngagements() {
  var data = state.data;
  return (state.byParty ? Promise.resolve() : loadMatters()).then(function () {
    var byParty = state.byParty;
    if (!byParty) throw new Error("The engagement group for this corporate tree did not resolve.");

    /* Notes only for audit clients: non-audit parties carry no audit rule */
    var auditIds = Array.from(byParty.keys()).filter(function (id) { return byParty.get(id).some(function (m) { return isAuditMatter(m.name); }); });
    return Promise.all(auditIds.map(function (id) {
      return callTool("get_party", { partyId: state.partyOf.get(id) || id, propertiesToLoad: ["Notes"] })
        .then(function (nraw) { var p = extractObj(nraw, "partyId"); return [id, p ? orbisFromNotes(p, p.bureauVanDijkId || id) : null]; })
        .catch(function () { return [id, null]; });
    })).then(function (pairs) {
      var orbis = new Map(), info = new Map(), names = new Map();
      pairs.forEach(function (pr) { orbis.set(pr[0], pr[1]); });
      everyNode().forEach(function (n) { names.set(n.id, n.name); });
      byParty.forEach(function (ms, id) { info.set(id, buildParty(ms, orbis.get(id))); });

      var notes = ["Entity rule from Moody's Orbis data recorded in party notes."];
      if (state.unmatched && state.unmatched.length) notes.push("Engagements for parties that match nothing in this tree or its close affiliates were not applied: " + state.unmatched.join(", ") + ".");
      var noNote = [], noCountry = [];
      info.forEach(function (v, id) {
        if (!v.audit || v.entity) return;
        if (!orbis.get(id)) noNote.push(names.get(id) || id); else noCountry.push(names.get(id) || id);
      });
      if (noNote.length) notes.push("No Orbis note on the party, so its entity rule is unknown: " + noNote.join(", ") + ".");
      if (noCountry.length) notes.push("No country recorded, so its entity rule is unknown: " + noCountry.join(", ") + ".");

      state.engInfo = info;
      state.engNotes = notes;
      state.engage = new Map();
      info.forEach(function (v, id) {
        state.engage.set(id, { audit: v.audit, nonAudit: v.nonAudit, apply: v.apply ? FRAMEWORK_RULE[v.apply] : null });
      });
      state.rulesRun = false;
      state.rowsTouched = false;
      delete state.expanded.eng;
    });
  });
}

/* Keep a placement when it is engaged or has an engaged descendant */
function filterTree(list, engaged) {
  var out = [];
  list.forEach(function (p) {
    var kids = filterTree(p.children, engaged);
    if (engaged.has(p.id) || kids.length) out.push({ id: p.id, name: p.name, key: p.key, children: kids });
  });
  return out;
}

function renderEngPage() {
  var info = state.engInfo, host = $("eng-grid");
  var roots = filterTree(state.trees, new Set(Array.from(info.keys()).concat(state.target.id))); /* engaged parties and the target, with their ancestors */
  host.innerHTML = "";
  document.querySelectorAll("#page-eng .eng-key").forEach(function (k) { k.hidden = !info.size; });
  $("eng-count").textContent = "";

  if (!info.size) {
    host.appendChild(el("div", "empty", "No engagements were found for this corporate tree, so there are no audit relationships to apply."));
  } else {
    if (!state.expanded.eng) {
      state.expanded.eng = new Set();
      (function open(list) { list.forEach(function (p) { state.expanded.eng.add(p.key); open(p.children); }); })(roots);
    }
    var byId = new Map();
    state.data.nodes.concat(state.data.affiliates).forEach(function (n) { if (!byId.has(n.id)) byId.set(n.id, n); });
    renderGrid("eng", "eng-grid", "eng-count", roots, byId, {
      pairs: [], redraw: renderEngPage,
      nameCls: function (n) { return info.get(n.id) || n.id === state.target.id ? "eng-party" : "anc"; },
      cols: [{ title: "Apply Audit Rule", cls: " rule-col", cell: function (n, td) { ruleCell(td, info.get(n.id)); } }]
    });
  }

  var foot = $("eng-foot");

  state.engNotes.forEach(function (t) { foot.appendChild(el("div", null, t)); });
}

/* ═══ STEP 3: INHERITANCE RULES (the independence tree) ═══════════════════ */
function runRules() {
  /* One row per audit client carrying its applied rule. Edits made on the tree page survive going back and forth. */
  if (!state.rulesRun) {
    state.auditRows = autoAuditRows(state.data);
    state.rowsTouched = false;
    state.rulesRun = true;
  }
}

/* ═══ STEP 4: THE ASSESSMENT ══════════════════════════════════════════════ */
/* The target's own result across every switched-on audit client and rule, in plain language */
function buildAssessment() {
  var t = state.target, pairs = auditPairs(), res = evalNode(t.id, pairs, state.serviceLine);
  var clients = pairs.length, s = clients === 1 ? "" : "s";
  var out = { level: res.level || "none", headline: "", summary: "", items: [], notes: [] };

  out.items = res.items.filter(function (i) { return i.level === res.level; }); /* only the strictest results */

  var switchedOff = state.auditRows.some(function (r) { return r.client && r.rule && !r.on; });
  if (!clients && switchedOff) {
    out.headline = "No audit rules applied";
    out.summary = "Every audit client is switched off, so no audit rules were applied to this engagement.";
  } else if (!clients) {
    out.headline = "No audit rules to apply";
    out.summary = "No audit client with an applicable rule was found in this corporate family, so none of the audit rules restrict this engagement.";
  } else if (res.level === "restricted") {
    out.headline = "Restricted";
    out.summary = "Under the rules applied, this non-audit engagement is restricted. " + t.name + " has a restricted relationship to " +
      res.items.filter(function (i) { return i.level === "restricted"; }).length + " of the " + clients + " audit client" + s + " considered.";
  } else if (res.level === "exempt") {
    out.headline = "Exempt";
    out.summary = "Under the rules applied, this service line is exempt, so no restriction or materiality check arises.";
  } else if (res.level === "materiality") {
    out.headline = "Materiality check needed";
    out.summary = "Under the rules applied, no restriction arises, but this non-audit engagement needs a materiality check before it can be accepted.";
  } else {
    out.headline = "No restriction identified";
    out.summary = "Under the rules applied, " + t.name + " has no restricted or materiality-check relationship to the " + clients + " audit client" + s + " considered.";
  }

  var self = state.engInfo && state.engInfo.get(t.id);
  if (self && self.audit) {
    out.notes.push(t.name + " is itself an audit client" + (self.apply ? " (rule applied: " + (RULES.filter(function (r) { return r.key === FRAMEWORK_RULE[self.apply]; })[0] || {}).label + ")" : "") +
      ". The rules here cover its relatives; its own position is not assessed.");
  }
  var off = state.auditRows.filter(function (r) { return r.client && r.rule && !r.on; });
  if (off.length) out.notes.push("Switched off and not applied: " + off.map(function (r) { return nameOfNode(r.client); }).join(", ") + ".");
  var none = state.auditRows.filter(function (r) { return r.client && !r.rule; });
  if (none.length) out.notes.push("No rule could be determined for " + none.map(function (r) { return nameOfNode(r.client); }).join(", ") + ", so it was not applied.");
  /* How each active rule read each relationship, including the service line, so a result can be checked */
  pairs.forEach(function (p) {
    var parts = (p.rels.get(t.id) || []).map(function (r) {
      var e = p.rule.by[REL_VALUE[r]];
      return r + " = " + (e ? (exemptFor(e.ex, state.serviceLine) ? "exempt" : e.t) + (e.ex.length ? " (exempt list: " + e.ex.join(", ") + ")" : "") : "not covered");
    });
    out.notes.push(p.rule.label + " from " + p.client.name + ": " + (parts.join("; ") || "no relationship") + ". Service line: " + (state.serviceLine || "none") + ".");
  });
  out.notes.push("This assessment applies the audit rules to corporate relationships only. It does not consider the specific services requested.");
  return out;
}

function nameOfNode(id) {
  var n = everyNode().filter(function (x) { return x.id === id; })[0];
  return n ? n.name + " (" + n.id + ")" : id;
}

function renderResult() {
  var A = state.assessment = buildAssessment(), t = state.target;
  var host = $("result-body");
  host.innerHTML = "";

  var banner = el("div", "verdict " + A.level);
  banner.appendChild(el("div", "verdict-head", A.headline));
  if (A.items.length) A.items.forEach(function (it) { banner.appendChild(resultRow(it)); });
  else banner.appendChild(el("div", "verdict-text", A.summary));
  host.appendChild(banner);

  if (A.items.length) {
    var head = el("div", "chart-head");
    var rp = el("button", "btn", "\u21BB Replay");
    rp.type = "button";
    head.appendChild(rp);
    host.appendChild(head);
    var box = el("div", "chart");
    host.appendChild(box);
    var m = chartModel(A.items, A.level);
    rp.addEventListener("click", function () { drawChart(box, m); playChart(m); });
    drawChart(box, m);
    playChart(m);
  }
  var nl = el("div", "result-notes");
  A.notes.forEach(function (n) { nl.appendChild(el("div", null, n)); });
  host.appendChild(nl);
}

/* ═══ RESULT CHART ════════════════════════════════════════════════════════
   The target, every parent, and every entity it inherited a strictest-level rule from, laid out as a tree. Each source's
   rule appears on it, then travels down the structure lines, turning into "Rule - Treatment" and leaving a copy on every
   entity it reaches on the way, until it arrives at the target.
   ═══════════════════════════════════════════════════════════════════ */
var chart = { tok: 0, skip: false };
function chartStop() { chart.tok++; }

function chartModel(items, level) {
  var parents = new Map(), meta = new Map(), tid = state.target.id;
  state.data.nodes.concat(state.data.affiliates).forEach(function (n) {
    if (!meta.has(n.id)) meta.set(n.id, n);
    var ps = parents.get(n.id) || [];
    n.parents.forEach(function (p) { if (ps.indexOf(p) === -1) ps.push(p); });
    parents.set(n.id, ps);
  });
  var inc = new Set([tid]);
  (function up(id) { (parents.get(id) || []).forEach(function (p) { if (!inc.has(p) && meta.has(p)) { inc.add(p); up(p); } }); })(tid);
  items.forEach(function (it) { /* join each source to what is already drawn by its nearest route upward */
    var q = [[it.client.id]], seen = {};
    seen[it.client.id] = 1;
    while (q.length) {
      var p = q.shift(), last = p[p.length - 1];
      if (inc.has(last)) { p.forEach(function (x) { inc.add(x); }); return; }
      (parents.get(last) || []).forEach(function (n) { if (!seen[n] && meta.has(n)) { seen[n] = 1; q.push(p.concat(n)); } });
    }
    inc.add(it.client.id);
  });
  var ids = Array.from(inc), edges = [], tier = {};
  ids.forEach(function (id) { tier[id] = 0; (parents.get(id) || []).forEach(function (p) { if (inc.has(p)) edges.push([p, id]); }); });
  for (var k = 0; k < ids.length; k++) edges.forEach(function (e) { tier[e[1]] = Math.max(tier[e[1]], tier[e[0]] + 1); });
  var sources = items.map(function (it, i) { /* the rule as inherited, before any service line exemption */
    var pair = { client: it.client, rule: it.rule, rels: relsFor(it.client.id) }, reach = {};
    var lvl = level === "exempt" ? evalNode(tid, [pair], null).level : level;
    ids.forEach(function (id) {
      if (id === it.client.id) return;
      if (id === tid || evalNode(id, [pair], null).level === lvl) reach[id] = 1;
    });
    return { key: i, client: it.client, rule: it.rule, reach: reach, lvl: lvl, exempt: level === "exempt" };
  });
  return { ids: ids, edges: edges, tier: tier, meta: meta, sources: sources, level: level };
}

function drawChart(box, m) {
  box.innerHTML = "";
  var W = 200, GX = 24, GY = 46, cv = el("div", "canvas"), rows = [], x = {};
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  cv.appendChild(svg);
  box.appendChild(cv);
  m.ids.forEach(function (id) { (rows[m.tier[id]] = rows[m.tier[id]] || []).push(id); });
  var widest = Math.max.apply(null, rows.map(function (r) { return r.length; })), total = widest * (W + GX);
  rows.forEach(function (r, ti) { /* order each row under the average position of its parents */
    if (ti) r.sort(function (a, b) {
      var bary = function (id) { var ps = m.edges.filter(function (e) { return e[1] === id; }); return ps.reduce(function (s, e) { return s + x[e[0]]; }, 0) / (ps.length || 1); };
      return bary(a) - bary(b);
    });
    r.forEach(function (id, i) { x[id] = (total - r.length * (W + GX)) / 2 + i * (W + GX) + (W + GX) / 2; });
  });
  cv.style.width = total + "px";
  m.card = {}; m.pill = {}; m.xpill = {}; m.rule = {}; m.base = {};
  m.ids.forEach(function (id) {
    var n = m.meta.get(id), isT = id === state.target.id, d = el("div", "cnode" + (isT ? " target" : ""));
    d.style.left = (x[id] - W / 2) + "px";
    d.appendChild(markCell(isT, id, siOnly(n)));
    d.appendChild(el("div", "cnm", n.name));
    d.appendChild(el("div", "cid", "(" + id + ")"));
    var rel = el("div", "crel");
    m.sources.forEach(function (s) {
      if (s.client.id === id) { m.rule[s.key] = el("span", "pop rpill", s.rule.label); rel.appendChild(m.rule[s.key]); }
      if (s.reach[id]) { m.pill[s.key + "|" + id] = el("span", "pop rule-badge " + s.lvl, s.rule.label + " - " + LEVEL_LABELS[s.lvl]); rel.appendChild(m.pill[s.key + "|" + id]); }
      if (isT && s.exempt) { m.xpill[s.key] = el("span", "pop rule-badge exempt", "Exempt Service Line"); rel.appendChild(m.xpill[s.key]); }
    });
    if (isT) { m.final = el("span", "pop rule-badge " + m.level, LEVEL_LABELS[m.level]); rel.appendChild(m.final); }
    d.appendChild(rel);
    cv.appendChild(d);
    m.card[id] = d;
  });
  var y = 12, bottom = 0;
  rows.forEach(function (r) { /* stack the rows by their real heights */
    var h = 0;
    r.forEach(function (id) { m.card[id].style.top = y + "px"; h = Math.max(h, m.card[id].offsetHeight); });
    y += h + GY;
    bottom = y - GY;
  });
  cv.style.height = (bottom + 14) + "px";
  svg.setAttribute("width", total);
  svg.setAttribute("height", bottom + 14);
  m.edges.forEach(function (e) {
    var g = chartSeg(m, e[0], e[1], false), pa = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pa.setAttribute("d", "M" + g.s.join(" ") + g.d);
    pa.setAttribute("class", "cedge");
    svg.appendChild(pa);
    m.base[e[0] + "|" + e[1]] = pa;
  });
  m.svg = svg;
  m.cv = cv;
}

/* Curve from the bottom of the upper card to the top of the lower one (reversed when walked upward) */
function chartSeg(m, from, to, rev) {
  var a = m.card[rev ? to : from], b = m.card[rev ? from : to];
  var x1 = a.offsetLeft + a.offsetWidth / 2, y1 = a.offsetTop + a.offsetHeight, x2 = b.offsetLeft + b.offsetWidth / 2, y2 = b.offsetTop, my = (y1 + y2) / 2;
  return rev ? { s: [x2, y2], d: "C" + x2 + " " + my + " " + x1 + " " + my + " " + x1 + " " + y1 }
             : { s: [x1, y1], d: "C" + x1 + " " + my + " " + x2 + " " + my + " " + x2 + " " + y2 };
}

function chartRoute(m, from, to) { /* shortest walk over the structure lines, either direction */
  var q = [[from]], seen = {};
  seen[from] = 1;
  while (q.length) {
    var p = q.shift(), last = p[p.length - 1];
    if (last === to) return p;
    m.edges.forEach(function (e) {
      var nx = e[0] === last ? e[1] : e[1] === last ? e[0] : null;
      if (nx && !seen[nx]) { seen[nx] = 1; q.push(p.concat(nx)); }
    });
  }
  return [from];
}

function chartWait(ms, tok) {
  return new Promise(function (ok, no) { setTimeout(function () { if (tok === chart.tok) ok(); else no(); }, chart.skip ? 0 : ms); });
}

/* One rule pill travelling from its source to one entity */
function chartTravel(m, s, to, tok) {
  return new Promise(function (ok, no) {
    var path = chartRoute(m, s.client.id, to), d = "", start = null, edge = {};
    m.edges.forEach(function (e) { edge[e[0] + "|" + e[1]] = 1; });
    for (var i = 0; i < path.length - 1; i++) {
      var fwd = edge[path[i] + "|" + path[i + 1]], g = fwd ? chartSeg(m, path[i], path[i + 1], false) : chartSeg(m, path[i], path[i + 1], true);
      d += (i ? " " : "M" + g.s.join(" ") + " ") + g.d;
    }
    var hl = document.createElementNS("http://www.w3.org/2000/svg", "path");
    hl.setAttribute("d", d);
    hl.setAttribute("class", "chl " + s.lvl);
    m.svg.appendChild(hl);
    var len = hl.getTotalLength(), dur = 300 + len * 3, turned = false;
    hl.style.strokeDasharray = len;
    hl.style.strokeDashoffset = len;
    var run = el("span", "crun rpill", s.rule.label);
    m.cv.appendChild(run);
    function frame(t) {
      if (tok !== chart.tok) { run.remove(); no(); return; }
      if (start === null) start = t;
      var k = chart.skip ? 1 : Math.min(1, (t - start) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      if (!turned && k > .12) { turned = true; run.className = "crun rule-badge " + s.lvl; run.textContent = s.rule.label + " - " + LEVEL_LABELS[s.lvl]; }
      var pt = hl.getPointAtLength(len * e);
      run.style.left = pt.x + "px";
      run.style.top = pt.y + "px";
      hl.style.strokeDashoffset = len * (1 - e);
      if (k < 1) requestAnimationFrame(frame); else { run.remove(); ok(); }
    }
    requestAnimationFrame(frame);
  });
}

function playChart(m) {
  var tok = ++chart.tok, tid = state.target.id, show = function (e) { e.classList.add("show"); };
  chart.skip = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  var dist = { }, q = [tid];
  dist[tid] = 0;
  while (q.length) {
    var l = q.shift();
    m.edges.forEach(function (e) { var nx = e[0] === l ? e[1] : e[1] === l ? e[0] : null; if (nx && dist[nx] == null) { dist[nx] = dist[l] + 1; q.push(nx); } });
  }
  var order = m.ids.filter(function (id) { return id !== tid; }).sort(function (a, b) { return (dist[a] || 0) - (dist[b] || 0); });
  var step = function (ms, fn) { return function () { if (fn) fn(); return chartWait(ms, tok); }; };
  var p = chartWait(200, tok).then(step(800, function () { show(m.card[tid]); }));
  order.forEach(function (id) {
    p = p.then(step(500, function () {
      show(m.card[id]);
      m.edges.forEach(function (e) { if (e.indexOf(id) > -1 && m.card[e[0]].classList.contains("show") && m.card[e[1]].classList.contains("show")) show(m.base[e[0] + "|" + e[1]]); });
    }));
  });
  m.sources.forEach(function (s) { p = p.then(step(400, function () { show(m.rule[s.key]); })); });
  p = p.then(step(300));
  m.sources.forEach(function (s) {
    p = p.then(function () {
      return Promise.all(Object.keys(s.reach).map(function (to) {
        return chartTravel(m, s, to, tok).then(function () {
          show(m.pill[s.key + "|" + to]);
          if (to !== tid) return;
          m.card[tid].classList.add("pulse");
          setTimeout(function () { m.card[tid].classList.remove("pulse"); }, 600);
          if (s.exempt) return chartWait(500, tok).then(function () { show(m.xpill[s.key]); }); /* then the service line exemption */
        });
      }));
    }).then(step(400));
  });
  p.then(function () { show(m.final); }).catch(function () {});
}

/* ═══ PROGRESS BAR ════════════════════════════════════════════════════════
   Four named steps always at the top. The five pages map onto them: entering the party and confirming its tree are both
   Find Tree. The highlighted step is the one whose result is on screen; finished steps are ticked. While a button works,
   the spinner sits on the step being worked out. */
var STEP_LABELS = ["Find Tree", "Identify Audit Relationships", "Apply Inheritance Rules", "Independence Decision"];
var PAGE_STEP = [0, 0, 1, 2, 3];
var busyStep = -1;

function updateStepper() {
  var last = step === STEPS.length - 1, cur = PAGE_STEP[step], eff = busyStep > cur ? busyStep : cur;
  var ol = el("ol");
  STEP_LABELS.forEach(function (t, i) {
    var done = last || i < eff;
    var li = el("li", "st" + (done ? " done" : i === eff ? " cur" : "") + (i === busyStep ? " busy" : ""));
    if (i === eff && !last) li.setAttribute("aria-current", "step");
    li.appendChild(el("span", "dot", done ? "✓" : String(i + 1)));
    li.appendChild(el("span", "lbl", t));
    ol.appendChild(li);
  });
  var host = $("stepper");
  host.innerHTML = "";
  host.appendChild(ol);
}

/* ═══ WIZARD ══════════════════════════════════════════════════════════════ */
var step = 0;
var STEPS = [
  { id: "page-start",  next: "Find Party", go: function () {
      var id = $("start-id").value.trim();
      if (!id) throw new Error("Pick a party from the list.");
      state.serviceLine = $("start-service").value || null;
      return loadFamily(id).then(setFamily).then(loadMatters);
    } },
  { id: "page-party",  next: "Find audit relationships and rules", enter: function () {
      $("party-name").textContent = "";
      $("party-name").appendChild(pinIcon());
      $("party-name").appendChild(document.createTextNode(state.target.name));
      $("party-name").appendChild(el("span", "node-id", "(" + state.target.id + ")"));
      renderFacts();
      $("party-service").value = state.serviceLine || "";
    }, go: function () { return findEngagements(); } },
  { id: "page-eng",    next: "Run inheritance rules", enter: renderEngPage, go: runRules },
  { id: "page-tree",   next: "Determine independence", enter: renderAll, go: function () {} },
  { id: "page-result", next: "Start over", enter: renderResult, go: function () { return 0; } }
];

function show(n) {
  chartStop();
  step = n;
  document.querySelectorAll(".page").forEach(function (p) { p.classList.toggle("active", p.id === STEPS[n].id); });
  document.body.setAttribute("data-step", String(n));
  $("node-count").hidden = n !== 3;
  $("wiz-back").hidden = n === 0;
  $("wiz-next").textContent = STEPS[n].next;
  $("wiz-err").textContent = "";
  closeWhy();
  closeDropdowns();
  if (STEPS[n].enter) STEPS[n].enter();
  updateHeader();
  busyStep = -1;
  updateStepper();
  window.scrollTo(0, 0);
}

function advance() {
  var btn = $("wiz-next"), from = step;
  $("wiz-err").textContent = "";
  btn.disabled = true;
  btn.textContent = "Working…";
  /* The spinner goes on the step being worked out: the first button works on Find Tree, the rest on the next step */
  busyStep = from === 0 ? 0 : from + 1 < STEPS.length ? PAGE_STEP[from + 1] : -1;
  updateStepper();
  new Promise(function (resolve) { resolve(STEPS[from].go()); })
    .then(function (to) { show(typeof to === "number" ? to : from + 1); })
    .catch(function (e) { $("wiz-err").textContent = e.message; btn.textContent = STEPS[step].next; busyStep = -1; updateStepper(); })
    .then(function () { btn.disabled = false; });
}

/* ═══ WIRING ══════════════════════════════════════════════════════════════ */
["start-service", "party-service"].forEach(function (id) { /* service line choices, grouped by the label's first word; a value is added where labels repeat */
  var sel = $(id), groups = {}, count = {};
  CONFIG.serviceLines.forEach(function (s) { count[s.label] = (count[s.label] || 0) + 1; });
  sel.appendChild(new Option("Not chosen", ""));
  CONFIG.serviceLines.forEach(function (s) {
    var g = s.label.split(" - ")[0], txt = s.label.slice(g.length + 3);
    if (!groups[g]) { groups[g] = document.createElement("optgroup"); groups[g].label = g; sel.appendChild(groups[g]); }
    groups[g].appendChild(new Option(count[s.label] > 1 ? txt + " (" + s.value + ")" : txt, s.value));
  });
});
["start-service", "party-service"].forEach(function (id) { /* either one sets the service line and mirrors the other, so going back never loses it */
  $(id).addEventListener("change", function () {
    state.serviceLine = this.value || null;
    $("start-service").value = $("party-service").value = this.value;
    updateHeader();
  });
});
$("wiz-next").addEventListener("click", advance);
$("wiz-back").addEventListener("click", function () { if (step > 0) show(step - 1); });

document.addEventListener("click", function (e) {
  if (!e.target.closest(".dd")) closeDropdowns();
  if (!e.target.closest("#why-pop, .rule-badge")) closeWhy();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeDropdowns(); closeWhy(); }
});
window.addEventListener("scroll", closeWhy, true); /* popover is fixed, so it would drift from its badge */
window.addEventListener("resize", closeWhy);
function applyCollapse() {
  ["audit"].forEach(function (k) {
    var c = state.collapsed[k], h = $("head-" + k);
    $("body-" + k).hidden = c;
    h.classList.toggle("closed", c);
    h.setAttribute("aria-expanded", c ? "false" : "true");
    h.querySelector(".tb-chev").textContent = c ? "▸" : "▾";
  });
}
document.querySelectorAll("[data-eng]").forEach(function (e) {
  var kind = e.getAttribute("data-eng");
  var icon = kind === "target" ? pinIcon() : engIcon(kind);
  if (kind === "target") { icon.removeAttribute("role"); icon.removeAttribute("aria-label"); icon.setAttribute("aria-hidden", "true"); icon.querySelector("title").remove(); } /* the text beside it names it */
  e.replaceWith(icon);
});
document.querySelectorAll(".tb-head").forEach(function (h) {
  h.addEventListener("click", function () {
    var k = h.getAttribute("data-sec");
    state.collapsed[k] = !state.collapsed[k];
    applyCollapse();
  });
});
$("add-audit").addEventListener("click", function () {
  state.auditRows.push({ client: null, rule: null, on: true });
  state.rowsTouched = true;
  renderAll();
});
/* The start page's logo, and the party search that feeds Find Party */
$("start-logo").appendChild(engIcon("audit"));
$("start-logo").appendChild(engIcon("non"));
/* ═══ PARTY SEARCH ════════════════════════════════════════════════════════
   Name lookup through intapp_compliance__search_entities (keyword + entityTypes ["Party"]). Picking a hit resolves to
   a party id, which feeds the existing pipeline. The response envelope varies by host, so it is normalised to
   [{ id, name }] with the same extractObj helper used everywhere else. */
function partyHits(raw) {
  var list = null;
  /* a bare array of hits (not MCP content blocks) */
  if (Array.isArray(raw) && raw.length && raw[0] && raw[0].text == null && raw[0].content == null) list = raw;
  if (!list) {
    var obj = extractObj(raw, "results") || extractObj(raw) || {};
    /* a plain object can still wrap the hits one level down */
    ["result", "data", "value", "payload"].forEach(function (k) {
      if (obj && !Array.isArray(obj) && !obj.results && !obj.entities && !obj.parties && obj[k] && typeof obj[k] === "object") obj = obj[k];
    });
    list = Array.isArray(obj) ? obj : obj.results || obj.entities || obj.parties || [];
  }
  return list.filter(function (r) { return !r.entityType || r.entityType === "Party"; }).map(function (r) {
    return { id: String(r.id || r.partyId || r.entityId || ""), name: String(r.name || r.displayName || r.id || r.partyId || r.entityId || "") };
  }).filter(function (r) { return r.id; });
}

/* Wire a search box to a results list and a hidden id field.
   opts: { onPick(hit), onClear(), onEnter() } - onEnter runs when Enter is pressed with a party already picked. */
function bindPartySearch(input, results, idField, opts) {
  var timer = null, seq = 0, rows = [], sel = -1;

  function close() { results.hidden = true; sel = -1; input.setAttribute("aria-expanded", "false"); }
  function highlight(i) {
    sel = i;
    rows.forEach(function (r, k) { r.classList.toggle("sel", k === i); });
    if (rows[i]) rows[i].scrollIntoView({ block: "nearest" });
  }
  function pick(h) {
    input.value = h.name;
    idField.value = h.id;
    close();
    if (opts.onPick) opts.onPick(h);
  }
  function render(hits, empty) {
    results.innerHTML = "";
    rows = [];
    sel = -1;
    if (!hits.length) {
      var none = document.createElement("div");
      none.className = "row none";
      none.textContent = empty || "No parties found";
      results.appendChild(none);
    }
    hits.slice(0, 25).forEach(function (h) {
      var row = document.createElement("div");
      row.className = "row";
      row.setAttribute("role", "option");
      row.textContent = h.name;
      var id = document.createElement("span");
      id.className = "id";
      id.textContent = "(" + h.id + ")";
      row.appendChild(id);
      row.addEventListener("mousedown", function (e) { e.preventDefault(); }); /* keep focus in the box */
      row.addEventListener("click", function () { pick(h); });
      results.appendChild(row);
      rows.push(row);
    });
    results.hidden = false;
    input.setAttribute("aria-expanded", "true");
    rows.forEach(function (r, k) { r.hit = hits[k]; });
  }
  function search(q) {
    var mine = ++seq; /* a slow earlier answer must not overwrite a newer one */
    if (q.length < 2) { close(); return; }
    callTool("search_entities", { keyword: q, entityTypes: ["Party"] })
      .then(function (raw) { if (mine === seq) render(partyHits(raw)); })
      .catch(function (e) { if (mine === seq) render([], "Search unavailable: " + e.message); });
  }

  input.addEventListener("input", function () {
    idField.value = "";
    if (opts.onClear) opts.onClear();
    clearTimeout(timer);
    timer = setTimeout(function () { search(input.value.trim()); }, 200);
  });
  input.addEventListener("keydown", function (e) {
    var open = !results.hidden && rows.length;
    if (e.key === "ArrowDown" && open) { e.preventDefault(); highlight((sel + 1) % rows.length); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); highlight((sel - 1 + rows.length) % rows.length); }
    else if (e.key === "Enter") {
      if (open) { e.preventDefault(); pick(rows[sel >= 0 ? sel : 0].hit); }
      else if (idField.value && opts.onEnter) opts.onEnter();
    } else if (e.key === "Escape") close();
  });
  document.addEventListener("click", function (e) {
    if (!results.contains(e.target) && e.target !== input) close();
  });

  /* Set the party directly (URL or host context), without searching */
  return { setId: function (id) { input.value = id; idField.value = id; close(); } };
}

var search = bindPartySearch($("start-input"), $("party-results"), $("start-id"), { onEnter: advance });

/* A party id can be passed in, so the wizard starts at the party page without typing:
     - the page URL:       ?partyId=9906   (or #partyId=9906; "party" also works)
     - the host context:   celeste.getContext(), read now and again when the host's init message arrives
   Context keys are checked defensively (partyId, party_id, party.partyId, party.id, params.partyId, input.partyId).
   The first id found wins: it fills the box and runs Find Party. A service line can come the same way
   (?serviceLine=TAX-110 or serviceLine in the host context); otherwise it is chosen on the party page. */
function partyFromUrl() {
  try {
    var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ""));
    return q.get("partyId") || q.get("party") || h.get("partyId") || h.get("party");
  } catch (e) { return null; }
}
function partyFromContext(ctx) {
  if (!ctx || typeof ctx !== "object") return null;
  var v = ctx.partyId || ctx.party_id || (ctx.party && (ctx.party.partyId || ctx.party.id)) ||
          (ctx.params && ctx.params.partyId) || (ctx.input && ctx.input.partyId);
  return v != null && String(v).trim() ? String(v).trim() : null;
}
function serviceFromUrl() {
  try { var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, "")); return q.get("serviceLine") || h.get("serviceLine"); } catch (e) { return null; }
}
function serviceFromContext(ctx) {
  return ctx && typeof ctx === "object" ? ctx.serviceLine || (ctx.params && ctx.params.serviceLine) || (ctx.input && ctx.input.serviceLine) || null : null;
}
var autoLoaded = false;
function autoLoad(id, svc) {
  if (autoLoaded || !id) return;
  autoLoaded = true;
  if (svc && Array.prototype.some.call($("start-service").options, function (o) { return o.value === svc; })) $("start-service").value = svc;
  search.setId(id);
  advance();
}
show(0);
autoLoad(partyFromUrl(), serviceFromUrl());
if (typeof window.celeste !== "undefined") {
  try { var c0 = window.celeste.getContext(); autoLoad(partyFromContext(c0), serviceFromContext(c0)); } catch (e) { /* no context yet */ }
}
window.addEventListener("message", function (ev) {
  var m = ev.data;
  if (ev.source === window.parent && m && m.type === "celeste.rpc.init") autoLoad(partyFromContext(m.context), serviceFromContext(m.context));
});
</script>
