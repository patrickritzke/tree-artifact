<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>
<div id="top">
<div id="header">
<div id="header-title"></div>
<span id="build"></span>
<span id="node-count" hidden></span>
</div>
<nav id="stepper" class="stepper" aria-label="Progress"></nav>
</div>
<main id="pages">
<section class="page" id="page-start">
<div class="start">
<div class="logo" id="start-logo"></div>
<h1>I'd like to open a new non-audit engagement for</h1>
<div class="search-wrap">
<input id="start-input" type="text" placeholder="Search parties by name…" autocomplete="off" aria-label="Search parties by name" role="combobox" aria-expanded="false" aria-controls="party-results" />
<div id="party-results" class="results" role="listbox" hidden></div>
</div>
<div class="svc"><label for="start-service">Service line</label><select id="start-service"></select></div>
<input type="hidden" id="start-id" />
<div class="hint">Search by name, then pick the party and, if you know it, the service line for the engagement.</div>
</div>
</section>
<section class="page" id="page-party">
<div class="card-page">
<div class="party-kicker">Party found</div>
<h1 id="party-name"></h1>
<div class="facts" id="party-facts"></div>
<div class="svc"><label for="party-service">Service line</label><select id="party-service"></select></div>
</div>
</section>
<section class="page" id="page-eng">
<div class="section">
<div class="section-head">
<span class="eng-key">
<span><span data-eng="target"></span>Target company</span>
<span><span data-eng="audit"></span>Audit client</span>
<span><span data-eng="non"></span>Non-audit client</span>
</span>
<span class="count" id="eng-count"></span>
</div>
<div class="grid-wrap" id="eng-grid"></div>
</div>
<div id="eng-foot"></div>
</section>
<section class="page" id="page-tree">
<div class="toolbar tb" id="bar-independence">
<button class="tb-head" id="head-audit" data-sec="audit" type="button" aria-expanded="true">
<span class="tb-chev">▾</span><span>Apply Audit Rules</span><span class="summary" id="rule-summary"></span>
</button>
<div class="tb-body" id="body-audit">
<div id="audit-rows"></div>
<div class="audit-foot"><button class="btn" id="add-audit" type="button">+ Add another audit client</button></div>
</div>
</div>
<div class="section">
<div class="section-head">
<span class="eng-key" hidden>
<span><span data-eng="target"></span>Target company</span>
<span><span data-eng="audit"></span>Audit client</span>
<span><span data-eng="non"></span>Non-audit client</span>
<span><span class="si-tag">SI</span>Significant influence only</span>
</span>
<span class="count" id="tree-count"></span>
</div>
<div class="grid-wrap" id="tree-grid"></div>
</div>
</section>
<section class="page" id="page-result">
<div class="card-page wide">
<div id="result-body"></div>
</div>
</section>
</main>
<footer class="wiz-foot">
<button class="btn" id="wiz-back" type="button" hidden>Back</button>
<span id="wiz-err" role="alert"></span>
