<div id="top">
<div id="header">
<div id="header-title"></div>
<span id="build"></span>

<div id="gear-wrap">

<div id="gear-menu"><button class="gear-opt" id="fw-open" type="button">Show My Inheritance Framework</button></div>
</div>
</div>
<nav id="stepper" class="stepper" aria-label="Progress"></nav>
</div>
<main id="pages">
<section class="page" id="page-start">
<div class="start">
<div class="logo" id="start-logo"></div>
<h1>I'd like to open a new non-audit engagement for</h1>
<div class="search-wrap">
<input id="start-input" type="text" placeholder="Search parties by name…" autocomplete="off" aria-label="Search parties by name" role="combobox" aria-expanded="false" aria-controls="party-results" />
<div id="party-results" class="results" role="listbox" hidden></div>
</div>
<div class="svc"><label for="start-service">Service line</label><select id="start-service"></select></div>
<input type="hidden" id="start-id" />
<div class="hint">Search by name, then pick the party and, if you know it, the service line for the engagement.</div>
</div>
</section>
<section class="page" id="page-find">
<div class="find">
<div class="card">
<div class="kicker">Found party</div>
<h1 id="find-name"></h1>
<div class="ids" id="find-ids"></div>
<div class="f3" id="find-facts"></div>
</div>
<div class="card" id="find-tree"></div>
<div class="card" id="find-audit"></div>
<div class="card" id="find-non"></div>
<div id="find-foot"></div>
</div>
</section>
<section class="page" id="page-tree">
<div class="toolbar tb" id="bar-independence">
<button class="tb-head" id="head-audit" data-sec="audit" type="button" aria-expanded="true">
<span class="tb-chev">▾</span><span>Apply Audit Rules</span><span class="summary" id="rule-summary"></span>
</button>
<div class="tb-body" id="body-audit">
<div id="audit-rows"></div>
<div class="audit-foot"><button class="btn" id="add-audit" type="button">+ Add another audit relationship</button></div>
</div>
</div>
<div class="toolbar tb" id="bar-display">
<button class="tb-head closed" id="head-display" data-sec="display" type="button" aria-expanded="false">
<span class="tb-chev">▸</span><span>Display Options</span><span class="summary" id="display-summary"></span>
</button>
<div class="tb-body" id="body-display" hidden>
<div class="opt-row"><span class="opt-label">Tree</span>
<span class="seg" id="tree-view"><button class="pill" type="button" data-v="filtered">Filtered tree (relationships only)</button><button class="pill" type="button" data-v="full">Full tree</button></span></div>
<div class="opt-row"><span class="opt-label">Rule inheritance</span>
<span class="seg" id="inherit-view"><button class="pill" type="button" data-v="strictest">Strictest rule inheritance only</button><button class="pill" type="button" data-v="all">All rule inheritance</button></span></div>
</div>
</div>
<div class="section">
<div class="section-head">
<h2>Corporate Tree (50%)</h2>
<span class="eng-key" hidden>
<span><span data-eng="target"></span>Target company</span>
<span><span data-eng="audit"></span>Audit relationship</span>
<span><span data-eng="non"></span>Non-audit relationship</span>
</span>
<span class="count" id="tree-count"></span>
</div>
<div class="grid-wrap" id="tree-grid"></div>
</div>
<div class="section" id="si-section" hidden>
<div class="section-head">
<h2>Significant Influence (20-50%)</h2>
<span class="count" id="si-count"></span>
</div>
<div class="grid-wrap" id="si-grid"></div>
</div>
</section>
<section class="page" id="page-result">
<div class="card-page wide">
<div id="result-body"></div>
</div>
</section>
</main>
<footer class="wiz-foot">
<button class="btn" id="wiz-back" type="button" hidden>Back</button>
<span id="wiz-err" role="alert"></span>
<button class="btn primary" id="wiz-next" type="button"></button>
</footer>
